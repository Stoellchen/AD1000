################################################################################
  notify_dispatch_working:
    alias: "Notify DISPATCH – entry point (core_ha_notify_settings)"
    mode: parallel

    sequence:
      # ------------------------------------------------------------------------
      # Parameter normalisieren
      # ------------------------------------------------------------------------
      - variables:
          prio: "{{ prio | upper }}"
          title: "{{ title }}"
          message: "{{ message }}"
          status: "{{ status | default('') | upper }}"
          size: "{{ size | default('M') | upper }}"

          # Optional übergebene Medien
          picture: "{{ picture | default('') }}"
          video: "{{ video | default('') }}"
          mp3: "{{ mp3 | default('') }}"

          # Basis-URL für Fallback-Bilder
          _media_base: "http://ad1000.main.arpa:8123/local/_service"


          # ONLY = reiner Filterstring (tvttsdisplay etc.)
          only: "{{ only | default('tts tv display mobile') | lower }}"

          # PRIO → Suffix für Entity-Namen
          prio_name: >
            {% if prio == 'A' %}alert
            {% elif prio == 'H' %}high
            {% elif prio == 'M' %}medium
            {% else %}low
            {% endif %}

          # Media-Type bestimmen
          media_type: >
            {% if video | length > 0 %}
              video
            {% elif mp3 | length > 0 %}
              mp3
            {% elif picture | length > 0 %}
              image
            {% else %}
              image
            {% endif %}

          # Finales Media (Priorität: Video > Picture > Fallback)
          media_url: >
            {% if video | length > 0 %}
              {{ video }}
            {% elif mp3 | length > 0 %}
              {{ mp3 }}
            {% elif picture | length > 0 %}
              {{ picture }}
            {% else %}
              {{ _media_base ~ '/_notification_picture_' ~ prio_name ~ '.png' }}
            {% endif %}

          # media_url_png for video or message or mp3 (Priorität: Video > Picture > Fallback)
          media_url_png: >
            {{ _media_base ~ '/_notification_picture_' ~ prio_name ~ '.png' }}

          # PRIO → Duration (zentral!)
          duration: >
            {% if prio == 'A' %}30
            {% elif prio == 'H' %}20
            {% elif prio == 'M' %}15
            {% else %}8
            {% endif %}

          # PRIO → TTS Volume (zentral)
          volume: >
            {% if prio == 'A' %}0.75
            {% elif prio == 'H' %}0.60
            {% elif prio == 'M' %}0.45
            {% else %}0.30
            {% endif %}

          # PRIO → Color (zentral!)
          color: >
            {% if prio == 'A' %}
              {{ 'red' if status != 'ON' else 'green' }}
            {% elif prio == 'H' %}
              amber
            {% elif prio == 'M' %}
              amber
            {% else %}
              grey
            {% endif %}

          # PRIO → Color (zentral!)
          fontsize: >
            {% if size == 'S' %}small
            {% elif size == 'L' %}large
            {% else %}medium
            {% endif %}

          # PRIO → Position (zentral!)
          position: >
            {% if prio == 'A' %}
              top-right
            {% elif prio == 'H' %}
              top-left
            {% elif prio == 'M' %}
              bottom-right
            {% else %}
              bottom-left
            {% endif %}

          # -------------------------------------------------
          # Quiet Hours pro Prio
          # -------------------------------------------------
          quiet_from: >
            {% if prio == 'H' %}22:00
            {% elif prio == 'M' %}21:00
            {% elif prio == 'L' %}20:00
            {% else %}00:00
            {% endif %}

          quiet_to: >
            {% if prio == 'H' %}07:00
            {% elif prio == 'M' %}08:00
            {% elif prio == 'L' %}09:00
            {% else %}00:00
            {% endif %}

          # -------------------------------------------------
          # Quiet-Hours aktiv?
          # (über Mitternacht korrekt!)
          # -------------------------------------------------
          in_quiet_hours: >
            {% if prio == 'A' %}
              false
            {% else %}
              {% set now = now().strftime('%H:%M') %}
              {% if quiet_from < quiet_to %}
                {{ quiet_from <= now < quiet_to }}
              {% else %}
                {{ now >= quiet_from or now < quiet_to }}
              {% endif %}
            {% endif %}

          # --------------------------------------------------------------------
          # Finale Werte (nach Quiet-Hours!)
          # --------------------------------------------------------------------
          final_volume: >
            {% if in_quiet_hours %}
              {{ (volume * 0.6) | round(2) }}
            {% else %}
              {{ volume }}
            {% endif %}

          final_duration: >
            {% if in_quiet_hours %}
              {{ (duration * 0.5) | int }}
            {% else %}
              {{ duration }}
            {% endif %}

      # ------------------------------------------------------------------------
      # ALERT → sofort
      # ------------------------------------------------------------------------
      - if:
          - condition: template
            value_template: "{{ prio == 'A' }}"
        then:
          - service: script.notify_dispatch_alert
            data:
              title: "{{ title }}"
              message: "{{ message }}"
              status: "{{ status }}"
              only: "{{ only }}"
              prio_name: "{{ prio_name }}"
              duration: "{{ final_duration }}"
              volume: "{{ final_volume }}"
              position: "{{ position }}"
              size: "{{ fontsize }}"
              color: "{{ color }}"
              media_type: "{{ media_type }}"
              media_url: "{{ media_url }}"
              media_url_png: "{{ media_url_png }}"  

        else:
          # --------------------------------------------------------------------
          # H / M / L → queued
          # --------------------------------------------------------------------
          - service: script.notify_dispatch_normal
            data:
              title: "{{ title }}"
              message: "{{ message }}"
              only: "{{ only }}"
              prio_name: "{{ prio_name }}"
              duration: "{{ final_duration }}"
              volume: "{{ final_volume }}"
              position: "{{ position }}"
              size: "{{ fontsize }}"
              color: "{{ color }}"
              media_type: "{{ media_type }}"
              media_url: "{{ media_url }}"

