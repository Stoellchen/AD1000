      - if:
          - condition: template
            value_template: "{{ 'tv' in only }}"
          - condition: state
            entity_id: input_boolean.notify_tv_prio_alert
            state: "on"
        then:
          # - service: notify.group_tv_notify_{{ prio_name }}
          - service: notify.android_tv_fire_tv
            data:
              title: "{{ title }}"
              message: "{{ message }}"
              data:
                fontsize: large
                position: top-left
                duration: 20
                color: "{{ color }}"


      # ------------------------------------------------------------------------
      # DISPLAY (Room-Mode aware, pro Device)
      # ------------------------------------------------------------------------
      - if:
          # Channel erlaubt?
          - condition: template
            value_template: "{{ 'display' in only }}"

          # Prio für Display erlaubt?
          - condition: template
            value_template: >
              {{ states('input_boolean.notify_display_prio_' ~ prio_name) == 'on' }}
        then:
          # Jedes Display einzeln prüfen
          # Alle Display-Devices aus der Gruppe holen
          - variables:
              # display_entities: >
              #   {{ state_attr('group.display_notify_' ~ prio_name, 'entity_id') or [] }}
              display_entities: >
                {{ state_attr('group.display_notify_' ~ prio_name, 'entity_id')
                  | default([], true)
                  | list }}
          - repeat:
              for_each: "{{ display_entities }}"
              # for_each: "{{ state_attr( display_entities , 'entity_id') | default([], true) | list }}"
              sequence:
                - variables:
                    display: "{{ repeat.item }}"
                    room: "{{ area_name(display) }}"
                    room_mode: >
                      {% if room %}
                        {{ states('input_select.room_mode_' ~ room | lower | replace(' ', '_')) }}
                      {% else %}
                        normal
                      {% endif %}
                # --------------------------------------------------------
                # Media-Ausgabe: Bild oder Video
                # --------------------------------------------------------
                - choose:
                  # ===============================
                  # VIDEO
                  # ===============================
                  - conditions:
                      - condition: template
                        value_template: "{{ media_type == 'video' }}"
                    sequence:
                      - alias: "turn media player on"
                        service: media_player.turn_on
                        target:
                          entity_id: media_player.info_3
                      - alias: "Play video on target media player"
                        service: media_player.play_media
                        target:
                          entity_id: media_player.info_3
                        data:
                          media_content_type: video
                          media_content_id: "{{ media_url }}"
                          extra:
                            metadata:
                              metadataType: 1
                              title: "{{ title }}"
                              subtitle: "{{ message }}"
                              images:
                                - url: "{{ media_url_png }}"    ## because we play the video


                  # ===============================
                  # MP3
                  # ===============================
                  - conditions:
                      - condition: template
                        value_template: "{{ media_type == 'mp3' }}"
                    sequence:
                      - alias: "turn media player on"
                        service: media_player.turn_on
                        target:
                          entity_id: media_player.info_3
                      - alias: "Play mp3 on target media player"
                        service: media_player.play_media
                        target:
                          entity_id: media_player.info_3
                        data:
                          media_content_type: audio/mp3
                          media_content_id: "{{ media_url }}"
                          extra:
                            metadata:
                              metadataType: 1
                              title: "{{ title }}"
                              subtitle: "{{ message }}"
                              images:
                                - url: "{{ media_url_png }}"    ## because we play the mp3

                  # ===============================
                  # IMAGE
                  # ===============================
                  - conditions:
                      - condition: template
                        value_template: "{{ media_type == 'image' }}"
                    sequence:
                      - alias: "turn media player on"
                        service: media_player.turn_on
                        target:
                          entity_id: media_player.info_3
                      - alias: "Call Google Home TTS screen with image"
                        service: script.turn_on
                        target:
                          entity_id: script.notify_google_home_tts_screen
                        data:
                          variables:
                            dummy_player: media_player.vlc_telnet
                            target: media_player.info_3
                            large_text: "{{ title }}"
                            small_text: "{{ message }}"
                            picture_url: "{{ media_url }}"
                      - alias: "Send the TTS service call to the dummy player"
                        # service: tts.google_cloud_say
                        service: tts.cloud_say
                        target: 
                          entity_id: media_player.vlc_telnet
                        data:
                          message: "{{ title }}! {{ message }}"


      # ------------------------------------------------------------------------
      # TTS ALERT (ignoriert DND!)
      # ------------------------------------------------------------------------
      - if:
          - condition: template
            value_template: "{{ 'tts' in only }}"
          - condition: state
            entity_id: input_boolean.notify_tts_prio_alert
            state: "on"
        then:
        - service: script.turn_on
          entity_id: script.notify_tts_speak
          data:
            variables:
              volume: "{{ volume }}"
              speakers: group.tts_notify_speaker_alert
              language: "de-CH"
              message:  "{{ message }}"

################################################################################
################################################################################
################################################################################



  notify_tts_speak:
    alias: "Notify TTS speak - queued!!!! (core_ha_notify_settings)"
    mode: queued

    sequence:
      # ------------------------------------------------------------------------
      # Gruppe → Einzelne Speaker auflösen
      # ------------------------------------------------------------------------
      - variables:
          speakers_group: "{{ speakers }}"
          base_volume: "{{ volume | float }}"
          speaker_entities: >
            {{ state_attr(speakers_group, 'entity_id') | default([], true) | list }}

      # ------------------------------------------------------------------------
      # Jeden Speaker einzeln prüfen & bedienen
      # ------------------------------------------------------------------------
      - repeat:
          for_each: "{{ speaker_entities }}"
#          for_each: "{{ state_attr('group.tts_notify_speaker_medium', 'entity_id') }}"
          sequence:
            - variables:
                speaker: "{{ repeat.item }}"
                room: "{{ area_name(speaker) }}"
                room_mode: >
                  {% if room %}
                    {{ states('input_select.room_mode_' ~ room | lower | replace(' ', '_')) }}
                  {% else %}
                    normal
                  {% endif %}

                # finale Lautstärke pro Speaker
                speaker_volume: >
                  {% if room_mode == 'quiet' %}
                    {{ (base_volume * 0.5) | round(2) }}
                  {% else %}
                    {{ base_volume }}
                  {% endif %}

            # -------------------------------------------------
            # SILENT → komplett überspringen
            # -------------------------------------------------
            - if:
                - condition: template
                  value_template: "{{ room_mode != 'silent' }}"
              then:
                # Speaker einschalten
                - service: media_player.turn_on
                  target:
                    entity_id: "{{ speaker }}"

                - delay: "00:00:01"

                # Lautstärke setzen
                - service: media_player.volume_set
                  target:
                    entity_id: "{{ speaker }}"
                  data:
                    volume_level: "{{ speaker_volume }}"

                # TTS nur auf diesem Speaker
                - service: tts.speak
                  data:
                    cache: true
                    message: "{{ message }}"
                    media_player_entity_id: "{{ speaker }}"
                    language: "{{ language }}"
                  target:
                    entity_id: tts.home_assistant_cloud


  notify_google_home_tts_screen:
    alias: "Notify Google Home - Send TTS with picture and information (core_ha_notify_settings)"
    description: Script to send a TTS with picture and text to a player with screen
    icon: mdi:cast-audio
    mode: parallel
    max: 20
    sequence:
      - alias: "Version number"
        variables:
          version: 2.0.1
      - wait_for_trigger:
          - platform: event
            event_type: call_service
            event_data:
              domain: media_player
              service: play_media
              service_data:
                media_content_type: music
                entity_id: "{{ [ dummy_player ] }}"

      - service: media_player.volume_set
        data:
          entity_id: "{{ target }}"
          volume_level: 0.3

      - alias: "Send TTS message with picture"
        service: media_player.play_media
        target: 
          entity_id: "{{ target }}"
        data:
          media_content_type: "music"
          media_content_id: "{{ wait.trigger.event.data.service_data.media_content_id }}"
          extra:
            metadata:
              metadataType: 3
              title: "{{ large_text }}"
              artist: "{{ small_text }}"
              images:
                - url: "{{ picture_url }}"

      - alias: "Send TTS message with picture"
        service: media_player.play_media
        target: 
          entity_id: "{{ target }}"
        data:
          media_content_type: "music"
          media_content_id: "{{ wait.trigger.event.data.service_data.media_content_id }}"
          extra:
            metadata:
              metadataType: 3
              title: "{{ large_text }}"
              artist: "{{ small_text }}"
              images:
                - url: "{{ picture_url }}"

  notify_dispatch_sms:
    alias: "Notify Dispatch SMS Alarm per Free senden (core_ha_notify_settings)"
    icon: "mdi:sms"
    
    # Hier definieren wir die Eingabefelder für die HA-Oberfläche
    fields:
      title:
        name: "Titel"
        description: "Optionaler Titel für die SMS (wird der Nachricht vorangestellt)"
        example: "⚠️ ALARM"
        required: false
        selector:
          text:
      message:
        name: "Nachricht"
        description: "Der eigentliche Inhalt der SMS"
        example: "Einbruchsalarm in Cazaugitat. Bewegung im Wohnzimmer erkannt!"
        required: true
        selector:
          text:
    # Hier wird die Logik ausgeführt
    sequence:
      - action: notify.free_sms_home
        data:
          # Die Free-API hat ein hartes Limit: Bei Texten, die extrem lang sind (meistens ab etwa 
          # 480 Zeichen, was ca. 3 verketteten SMS entspricht), schneidet Free entweder eiskalt ab oder wirft einen Fehler.
          # Falls ein Titel angegeben wurde, setzt das Skript ihn mit einem Doppelpunkt vor die Nachricht
          # AUF 475 gesetzt - das sind dann DREI SMS die zusammengesetzt werden.
          message: >
            {% set limit = 475 %}
            {% if title is defined and title | length > 0 %}
              {% set full_msg = title ~ ": " ~ message %}
            {% else %}
              {% set full_msg = message %}
            {% endif %}
            
            {# Hier wird geprüft, ob die Nachricht gekürzt werden muss #}
            {% if full_msg | length > limit %}
              {{ full_msg[:limit - 3] }}...
            {% else %}
              {{ full_msg }}
            {% endif %}



