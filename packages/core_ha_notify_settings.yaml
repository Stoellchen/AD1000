################################################################################
## SCRIPT 1 – NOTIFY DISPATCH (SINGLE ENTRY POINT)
##
## EINZIGER Einstiegspunkt für alle Notifications
##
## Parameter:
##   prio:    A | H | M | L
##   title:   Text
##   message: Text
##   status:  ON | OFF        (nur für ALERT relevant)
##   only:    Filter-String   (z. B. tvttsdisplay, tv,tts,display)
##            Default = ALLES (tts + tv + display + mobile)
##   size:    S | M | L       (optional, Default = M)
################################################################################
################################################################################
## SCRIPT 1 – NOTIFY DISPATCH (SINGLE ENTRY POINT)
################################################################################


  notify_dispatch:
    alias: "Notify DISPATCH – entry point (core_ha_notify_settings)"
    mode: parallel

    # ------------------------------------------------------------------------
    # NEU: Felder für das UI/Skript-Eingabe definieren
    # ------------------------------------------------------------------------
    fields:
      prio:
        description: "Priorität (A, H, M, L)"
        example: "H"
      title:
        description: "Titel der Nachricht"
        example: "Titel der Nachricht"
      message:
        description: "Nachrichtentext"
        example: "Inhalt der Nachricht"
      status:
        description: "Status (z.B. ON/OFF)"
        example: "ON"
      size:
        description: "Schriftgröße (S, M, L)"
        example: "M"
      only:
        description: "Medien-Filter (tts tv display mobile sms)"
        example: "tts tv"
      picture:
        description: "Optional: Bild-URL"
      video:
        description: "Optional: Video-URL"
      mp3:
        description: "Optional: MP3-URL"
      room:
        description: "Optional: Ziel-Raum (z.B. Wohnzimmer, Garage). Wenn leer, gilt es überall."
        example: "Wohnzimmer"

    sequence:
      # ------------------------------------------------------------------------
      # Parameter normalisieren
      # ------------------------------------------------------------------------
      - variables:
          prio: "{{ prio | upper }}"
          title: "{{ title }}"
          message: "{{ message }}"
          status: "{{ status | default('') | upper }}"
          size: "{{ size | default('M') | upper }}"

          # Optional übergebene Medien
          picture: "{{ picture | default('') }}"
          video: "{{ video | default('') }}"
          mp3: "{{ mp3 | default('') }}"

          # Basis-URL für Fallback-Bilder
          _media_base: "http://ad1000.main.arpa:8123/local/_service"


          # ONLY = reiner Filterstring (tvttsdisplay etc.)
          only: "{{ only | default('tts tv display mobile') | lower }}"

          # --------------------------------------------------------------------
          # NEU: Raum-Parameter normalisieren (Kleinbuchstaben, ohne Leerzeichen)
          # Wenn kein Raum übergeben wird, setzen wir den Standard auf 'all'
          # --------------------------------------------------------------------
          # --------------------------------------------------------------------
          # KORRIGIERT: Raum-Parameter als Liste aufbauen (enthält 'all' NUR wenn gewollt)
          # --------------------------------------------------------------------
          target_room: >-
            {% set r = room | default('all') %}
            {% if r in ['all', '', none, 'none'] %}
              {{ ['all'] }}
            {% elif r is string %}
              {{ (r | lower | replace(' ', '')).split(',') }}
            {% elif r is iterable %}
              {{ r | map('lower') | map('trim') | list }}
            {% else %}
              {{ ['all'] }}
            {% endif %}

          # PRIO → Suffix für Entity-Namen
          prio_name: >
            {% if prio == 'A' %}alert
            {% elif prio == 'H' %}high
            {% elif prio == 'M' %}medium
            {% else %}low
            {% endif %}

          # Media-Type bestimmen
          media_type: >
            {% if video | length > 0 %}
              video
            {% elif mp3 | length > 0 %}
              mp3
            {% elif picture | length > 0 %}
              image
            {% else %}
              image
            {% endif %}

          # Finales Media (Priorität: Video > Picture > Fallback)
          media_url: >
            {% if video | length > 0 %}
              {{ video }}
            {% elif mp3 | length > 0 %}
              {{ mp3 }}
            {% elif picture | length > 0 %}
              {{ picture }}
            {% else %}
              {{ _media_base ~ '/_notification_picture_' ~ prio_name ~ '.png' }}
            {% endif %}

          # media_url_png for video or message or mp3 (Priorität: Video > Picture > Fallback)
          media_url_png: >
            {{ _media_base ~ '/_notification_picture_' ~ prio_name ~ '.png' }}

          # PRIO → Duration (zentral!)
          duration: >
            {% if prio == 'A' %}30
            {% elif prio == 'H' %}20
            {% elif prio == 'M' %}15
            {% else %}8
            {% endif %}

          # PRIO → TTS Volume (zentral)
          volume: >
            {% if prio == 'A' %}0.75
            {% elif prio == 'H' %}0.60
            {% elif prio == 'M' %}0.45
            {% else %}0.30
            {% endif %}

          # PRIO → Color (zentral!)
          color: >
            {% if prio == 'A' %}
              {{ 'red' if status != 'ON' else 'green' }}
            {% elif prio == 'H' %}
              amber
            {% elif prio == 'M' %}
              amber
            {% else %}
              grey
            {% endif %}

          # PRIO → Color (zentral!)
          fontsize: >
            {% if size == 'S' %}small
            {% elif size == 'L' %}large
            {% else %}medium
            {% endif %}

          # PRIO → Position (zentral!)
          position: >
            {% if prio == 'A' %}
              top-right
            {% elif prio == 'H' %}
              top-left
            {% elif prio == 'M' %}
              bottom-right
            {% else %}
              bottom-left
            {% endif %}

          # -------------------------------------------------
          # Quiet Hours pro Prio
          # -------------------------------------------------
          quiet_from: >
            {% if prio == 'H' %}22:00
            {% elif prio == 'M' %}21:00
            {% elif prio == 'L' %}20:00
            {% else %}00:00
            {% endif %}

          quiet_to: >
            {% if prio == 'H' %}07:00
            {% elif prio == 'M' %}08:00
            {% elif prio == 'L' %}09:00
            {% else %}00:00
            {% endif %}

          # -------------------------------------------------
          # Quiet-Hours aktiv?
          # (über Mitternacht korrekt!)
          # -------------------------------------------------
          in_quiet_hours: >
            {% if prio == 'A' %}
              false
            {% else %}
              {% set now = now().strftime('%H:%M') %}
              {% if quiet_from < quiet_to %}
                {{ quiet_from <= now < quiet_to }}
              {% else %}
                {{ now >= quiet_from or now < quiet_to }}
              {% endif %}
            {% endif %}

          # --------------------------------------------------------------------
          # Finale Werte (nach Quiet-Hours!)
          # --------------------------------------------------------------------
          final_volume: >
            {% if in_quiet_hours %}
              {{ (volume * 0.6) | round(2) }}
            {% else %}
              {{ volume }}
            {% endif %}

          final_duration: >
            {% if in_quiet_hours %}
              {{ (duration * 0.5) | int }}
            {% else %}
              {{ duration }}
            {% endif %}

      # ------------------------------------------------------------------------
      # ALERT → sofort
      # ------------------------------------------------------------------------
      - if:
          - condition: template
            value_template: "{{ prio == 'A' }}"
        then:
          - service: script.notify_dispatch_alert
            data:
              title: "{{ title }}"
              message: "{{ message }}"
              status: "{{ status }}"
              only: "{{ only }}"
              room: "{{ target_room }}"
              prio_name: "{{ prio_name }}"
              duration: "{{ final_duration }}"
              volume: "{{ final_volume }}"
              position: "{{ position }}"
              size: "{{ fontsize }}"
              color: "{{ color }}"
              media_type: "{{ media_type }}"
              media_url: "{{ media_url }}"
              media_url_png: "{{ media_url_png }}"  

        else:
          # --------------------------------------------------------------------
          # H / M / L → queued
          # --------------------------------------------------------------------
          - service: script.notify_dispatch_normal
            data:
              title: "{{ title }}"
              message: "{{ message }}"
              only: "{{ only }}"
              room: "{{ target_room }}"
              prio_name: "{{ prio_name }}"
              duration: "{{ final_duration }}"
              volume: "{{ final_volume }}"
              position: "{{ position }}"
              size: "{{ fontsize }}"
              color: "{{ color }}"
              media_type: "{{ media_type }}"
              media_url: "{{ media_url }}"

  ################################################################################
  ## SCRIPT 2 – NOTIFY DISPATCH NORMAL (H / M / L)
  ################################################################################
  notify_dispatch_normal:
    alias: "Notify DISPATCH NORMAL (H/M/L) (core_ha_notify_settings)"
    mode: queued

    sequence:
      # ------------------------------------------------------------------------
      # Ableitungen
      # ------------------------------------------------------------------------
      - variables:
          only: "{{ only }}"
          prio_name: "{{ prio_name }}"

      # ------------------------------------------------------------------------
      # TV (Weist den Raum über den zugehörigen Mediaplayer zu)
      # ------------------------------------------------------------------------
      - if:
          - condition: template
            value_template: "{{ 'tv' in only or 'all' in only }}"
          - condition: template
            value_template: >
              {{ states('input_boolean.notify_tv_prio_' ~ prio_name) == 'on' }}
        then:
          - variables:
              tv_entities: >
                {{ state_attr('group.tv_notify_' ~ prio_name, 'entity_id') | default([], true) | list }}
              target_room_filter: "{{ room }}"

          - repeat:
              for_each: "{{ tv_entities }}"
              sequence:
                - variables:
                    current_item: "{{ repeat.item }}"
                    # Hier wandeln wir "notify.android_tv_..." um in "media_player.android_tv_..."
                    # Wenn du in Home Assistant eine Gruppe unter der Domäne group: anlegst (wie deine tv_notify_alert), 
                    # wandelt Home Assistant die Entitäten darin intern nicht automatisch in die langen Dienstnamen um. 
                    # Stattdessen versucht er, den Namen zu kürzen, oder greift auf alte Zuweisungen zurück. Wenn im Trace 
                    # notify.sony herauskommt, versucht das Skript einen Dienst aufzurufen, den es gar nicht gibt, und bricht ab.
                    # associated_media_player: "{{ tv_service | replace('notify.', 'media_player.') }}"
                    # Jetzt holen wir den Raum vom Mediaplayer!
                    # Extrahiert den reinen Namen (z.B. "sony" oder "googletv")
                    device_pure_name: "{{ current_item | replace('notify.', '') }}"

                    # Variante 1: Der direkte Kurzname aus der Gruppe
                    tv_service_short: "{{ current_item }}"

                    # HIER WIRD AUFGEBLASEN: Setzt den exakten, langen Dienstnamen zusammen
                    # Ergebnis: notify.android_tv_fire_tv_sony_main_arpa
                    tv_service_long: "notify.android_tv_fire_tv_{{ device_pure_name }}_main_arpa"

                    # Setzt den zugehörigen Mediaplayer für die Raumsuche zusammen
                    # Ergebnis: media_player.sony
                    associated_media_player: "media_player.{{ device_pure_name }}"
                    
                    # Holt den Raum von diesem Mediaplayer (z.B. Wohnzimmer)
                    device_room: "{{ area_name(associated_media_player) }}"
                    
                    room_mode: >
                      {% if device_room %}
                        {{ states('input_select.room_mode_' ~ device_room | lower | replace(' ', '_')) }}
                      {% else %}
                        normal
                      {% endif %}
                    
                    room_match: >
                      {{ target_room_filter == ['all'] or (device_room | lower | trim) in target_room_filter }}
                    mode_allowed: >
                      {{ room_mode == 'normal' or (room_mode == 'quiet' and prio_name == 'high') }}


                # sendet an den langen und kurzen Dienst, damit sowohl die alten notify.sony Aufrufe in der Gruppe funktionieren, als auch die neuen, langen Dienste, die den Raum korrekt zuordnen können.
                - continue_on_error: true
                  service: "{{ tv_service_long }}"
                  data:
                    title: "{{ title }}"
                    message: "{{ message }}"
                    data:
                      fontsize: "{{ fontsize }}"
                      position: "{{ position }}"
                      duration: "{{ duration }}"
                      color: "{{ color }}"
                - continue_on_error: true
                  service: "{{ tv_service_short }}"
                  data:
                    title: "{{ title }}"
                    message: "{{ message }}"
                    data:
                      fontsize: "{{ fontsize }}"
                      position: "{{ position }}"
                      duration: "{{ duration }}"
                      color: "{{ color }}"



      # ------------------------------------------------------------------------
      # TV (über Gruppe!) OLD WORKING, da die Gruppe nicht mehr über die Prio-Input-Booleans gesteuert wird, sondern über separate Gruppen für jede Prio (alert, high, medium, low)
      # ------------------------------------------------------------------------
#      - if:
#          - condition: template
#            value_template: "{{ 'tv' in only }}"
#          - condition: template
#            value_template: >
#              {{ states('input_boolean.notify_tv_prio_' ~ prio_name) == 'on' }}
#        then:
#          # - service: notify.group_tv_notify_{{ prio_name }}
#          - service: notify.android_tv_fire_tv
#            data:
#              title: "{{ title }}"
#              message: "{{ message }}"
#              data:
#                fontsize: "{{ fontsize }}"
#                position: "{{ position }}"
#                duration: "{{ duration }}"
#                color: "{{ color }}"

      # ------------------------------------------------------------------------
      # DISPLAY (Room-Mode aware, pro Device)
      # ------------------------------------------------------------------------
      - if:
          # Channel erlaubt?
          - condition: template
            value_template: "{{ 'display' in only or 'all' in only }}"

          # Prio für Display erlaubt?
          - condition: template
            value_template: >
              {{ states('input_boolean.notify_display_prio_' ~ prio_name) == 'on' }}

        then:
          # Alle Display-Devices aus der Gruppe holen
          - variables:
              display_entities: >
                {{ state_attr('group.display_notify_' ~ prio_name, 'entity_id')
                  | default([], true)
                  | list }}
              # Wir sichern den vom Hauptskript übergebenen Zielraum in einer eigenen Variable,
              # da 'room' gleich innerhalb der Schleife für den Geräteraum überschrieben wird.
              # target_room_filter: "{{ room | default('all') | lower | trim }}"
              # Erstellt eine saubere Liste aus den übergebenen Räumen und fügt IMMER 'all' hinzu
              # target_room_filter: >-
              #  {% if room is string %}
              #    {{ room | lower | replace(' ', '') | split(',') + ['all'] }}
              #  {% elif room is iterable %}
              #    {{ room | map('lower') | map('trim') | list + ['all'] }}
              #  {% else %}
              #    {{ ['all'] }}
              #  {% endif %}
              target_room_filter: "{{ room }}"

          # Jedes Display einzeln prüfen
          - repeat:
              for_each: "{{ display_entities }}"
              # for_each: "{{ state_attr( display_entities , 'entity_id') | default([], true) | list }}"
              sequence:
                - variables:
                    display: "{{ repeat.item }}"
                    device_room: "{{ area_name(display) }}"
                    room_mode: >
                      {% if device_room %}
                        {{ states('input_select.room_mode_' ~ device_room | lower | replace(' ', '_')) }}
                      {% else %}
                        normal
                      {% endif %}
                    # Prüfen, ob der Raum zum Filter passt
                    # room_match: >
                    #  {{ target_room_filter == 'all' or target_room_filter == room | lower | trim }}
                    # 1. Fall: Wenn die Liste EXAKT nur ['all'] ist (globaler Versand)
                    # 2. Fall: Wenn der Raum des aktuellen Geräts in der Liste 'room' existiert
                    room_match: >
                      {{ target_room_filter == ['all'] or (device_room | lower | trim) in target_room_filter }}

                    # Prüfen, ob der aktuelle Room-Mode die Prio erlaubt
                    mode_allowed: >
                      {{ room_mode == 'normal' or (room_mode == 'quiet' and prio_name == 'high') }}

                # Nur ausführen, wenn der Raum filtermäßig passt UND der Modus es erlaubt
                - if:
                    - condition: template
                      value_template: "{{ room_match and mode_allowed }}"
                  then:
                    # --------------------------------------------------------
                    # Media-Ausgabe: Bild oder Video
                    # --------------------------------------------------------
                    - choose:
                      # ===============================
                      # VIDEO
                      # ===============================
                      - conditions:
                          - condition: template
                            value_template: "{{ media_type == 'video' }}"

                        sequence:
                          - alias: "turn media player on"
                            service: media_player.turn_on
                            target:
                              entity_id: "{{ display }}"
                          - alias: "Play video on target media player"
                            service: media_player.play_media
                            target:
                              entity_id: "{{ display }}"
                            data:
                              media_content_type: video
                              media_content_id: "{{ media_url }}"
                              extra:
                                metadata:
                                  metadataType: 1
                                  title: "{{ title }}"
                                  subtitle: "{{ message }}"
                                  images:
                                    - url: "{{ media_url_png }}"

                      # ===============================
                      # MP3
                      # ===============================
                      - conditions:
                          - condition: template
                            value_template: "{{ media_type == 'mp3' }}"
                        sequence:
                          - alias: "turn media player on"
                            service: media_player.turn_on
                            target:
                              entity_id: "{{ display }}"
                          - alias: "Play mp3 on target media player"
                            service: media_player.play_media
                            target:
                              entity_id: "{{ display }}"
                            data:
                              media_content_type: audio/mp3
                              media_content_id: "{{ media_url }}"
                              extra:
                                metadata:
                                  metadataType: 1
                                  title: "{{ title }}"
                                  subtitle: "{{ message }}"
                                  images:
                                    - url: "{{ media_url_png }}"

                      # ===============================
                      # IMAGE
                      # ===============================
                      - conditions:
                          - condition: template
                            value_template: "{{ media_type == 'image' }}"
                        sequence:
                          - alias: "turn media player on"
                            service: media_player.turn_on
                            target:
                              entity_id: "{{ display }}"
                          - alias: "Call Google Home TTS screen with image"
                            service: script.turn_on
                            target:
                              entity_id: script.notify_google_home_tts_screen
                            data:
                              variables:
                                dummy_player: media_player.vlc_telnet
                                target: "{{ display }}"
                                large_text: "{{ title }}"
                                small_text: "{{ message }}"
                                picture_url: "{{ media_url }}"
                          - alias: "Send the TTS service call to the dummy player"
                            service: tts.cloud_say
                            target: 
                              entity_id: media_player.vlc_telnet
                            data:
                              message: "{{ title }}! {{ message }}"

      # ------------------------------------------------------------------------
      # TTS (über Gruppe, DND gilt - KORRIGIERT & FIXIERT)
      # ------------------------------------------------------------------------
      - if:
          # Channel erlaubt?
          - condition: template
            value_template: "{{ 'tts' in only or 'all' in only }}"

          # Prio für TTS erlaubt und DND aus?
          - condition: template
            value_template: >
              {{
                states('input_boolean.notify_tts_prio_' ~ prio_name) == 'on'
                and states('input_boolean.notify_tts_dnd') != 'on'
              }}
        then:
          - variables:
              # Holt die einzelnen Entities aus der korrekten Gruppe
              tts_entities: >
                {{ state_attr('group.tts_notify_speaker_' ~ prio_name, 'entity_id')
                  | default([], true)
                  | list }}
              target_room_filter: "{{ room }}"

          - repeat:
              for_each: "{{ tts_entities }}"
              sequence:
                # --------------------------------------------------------------
                # Erst die Variablen für JEDES einzelne Gerät berechnen
                # --------------------------------------------------------------
                - variables:
                    entity: "{{ repeat.item }}"
                    device_room: "{{ area_name(entity) }}"
                    room_mode: >
                      {% if device_room %}
                        {{ states('input_select.room_mode_' ~ device_room | lower | replace(' ', '_')) }}
                      {% else %}
                        normal
                      {% endif %}
                      
                    # Abgleich gegen die aus dem Hauptskript übergebene 'room'-Liste
                    room_match: >
                      {{ target_room_filter == ['all'] or (device_room | lower | trim) in target_room_filter }}
                      
                    # Prüfen, ob der Raum-Modus die Prio zulässt
                    mode_allowed: >
                      {{ room_mode == 'normal' or (room_mode == 'quiet' and prio_name == 'high') }}

                # --------------------------------------------------------------
                # Erst JETZT wird geprüft, ob die Nachricht abgespielt werden darf!
                # --------------------------------------------------------------
                - if:
                    - condition: template
                      value_template: "{{ room_match and mode_allowed }}"
                  then:
                    - service: script.turn_on
                      target:
                        entity_id: script.notify_tts_speak
                      data:
                        variables:
                          message: "{{ message }}"
                          speakers: "{{ entity }}" # Übergibt exakt die geprüfte Entity
                          volume: "{{ volume }}"
                          language: "de-DE"



