# ==============================================================================
# DATEINAME: weather_ha_weinkeller.yaml
# ZWECK: Intelligente Weinkeller-Lüftung für 33790 Cazaugitat via Home Assistant
# ANBIETER: Gledopto GL-C-301P (Dimmer-Modus) & Netatmo Sensoren
#
# LOGIK-OPTIMIERUNG:
# - Zentrale Variablen-Definition der Sensoren ganz oben in der Automation.
# - Keine unnötige Feuchtigkeit: Lüfter schaltet bei zu hohem Taupunkt komplett AUS.
# - Zielwert-Abschaltung: Stoppt die Kühlung, sobald der Zielwert (12°C) erreicht ist.
# ==============================================================================

## ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! !
## light.e4 umbenennen in light.weinkeller_fan, damit die Automatisierung funktioniert!

# ==============================================================================
# LÜFTUNGSKONZEPT & SENSOR-POSITIONIERUNG (DOKUMENTATION)
# ==============================================================================
# 
# 1. STRÖMUNGSRICHTUNG (Unterdruck-Verfahren / Querlüftung):
# ------------------------------------------------------------------------------
# - Der Ventilator drückt die Luft AKTIV durch das ABLUFTROHR nach draußen.
# - Dadurch entsteht im Weinkeller ein minimaler, gewünschter Unterdruck.
# - Frischluft strömt PASSIV durch das Eintrittsrohr auf der Gegenseite nach.
# - VORTEIL: Verhindert, dass feucht-warme Luft unkontrolliert in Ritzen oder 
#   hinter Weinregale gepresst wird (Schutz vor verstecktem Kondenswasser).
# - THERMIK-TIPP: Das Abluftrohr sollte idealerweise OBEN an der Decke sitzen 
#   (saugt warme Stauluft ab). Das Eintrittsrohr sollte UNTEN nahe am Boden 
#   enden (bringt kühle Nachtluft an den tiefsten Punkt).
# - WICHTIG: Das Eintrittsrohr benötigt eine mechanische Rückschlagklappe, 
#   damit bei stehendem Lüfter (Standby/Sperre) keine Warmluft nachströmt!
#
# 2. POSITIONIERUNG DES EM-KOMBI-SENSORS (Temperatur, Feuchte & 24GHz Präsenz):
# ------------------------------------------------------------------------------
# - HÖHE: Auf ca. 1,40m bis 1,60m (Augenhöhe) anbringen.
#   * Zu tief (Boden): Misst zu kalt / zu feucht -> Automation stoppt zu früh.
#   * Zu hoch (Decke): Misst warme Stauluft -> Automation lüftet fälschlicherweise.
#   * Augenhöhe liefert die perfekte Mischtemperatur und ist die ideale Höhe 
#     für die 24-GHz-Präsenzerkennung.
#
# - HORIZONTAL: Mittig im Raum oder im hinteren Drittel (nahe den Weinregalen).
#   * ABSOLUTES TABU: Niemals in die Nähe des Frischluft-Eintrittsrohrs hängen! 
#     Der Sensor würde sonst sofort nach dem Einschalten die reingezogene 
#     Außenluft messen und die Automation verfälschen, bevor der Raum 
#     überhaupt durchge kühlt ist.
#
# - UMGEBUNG: 
#   * Nicht flach auf unisolierte Außenwände schrauben (Gefahr von Verfälschung 
#     durch Mauerwerk-Kälte). Ggf. auf Holz oder mit kleinem Abstandshalter montieren.
#   * Freies Sichtfeld in den Raum wahren, damit die 24-GHz-Belegung nicht durch 
#     massive Weinboxen oder Säulen blockiert wird.
# ==============================================================================

