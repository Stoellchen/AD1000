input_number:
  away_started_ts:
    name: Away started (timestamp)
    min: 0
    max: 4102444800   # Jahr 2100
    step: 1
    mode: box
    icon: mdi:timer-outline


template:
  # ------------------------------------------------
  # Dynamic countdown status
  # ------------------------------------------------
  - sensor:
      - name: alarm_away_turnoff_status
        icon: mdi:timer-outline
        state: "{{ now().strftime('%H:%M:%S') }}"
        attributes:
          devices: {}

  # ------------------------------------------------
  # Static AWAY definition (from labels)
  # ------------------------------------------------
  - trigger:
      - platform: time_pattern
        seconds: "/1"
      - platform: state
        entity_id: binary_sensor.occupied_home_1

    sensor:
      - name: alarm_away_devices_definition
        icon: mdi:home-export-outline
        state: "ok"
        attributes:
          devices: >
            {% set defs = namespace(map={}) %}
            {% set away = is_state('binary_sensor.occupied_home_1','off') %}
            {% set away_ts = states('input_number.away_started_ts') | float(0) %}
            {% set now_ts = now().timestamp() %}

            {% if away and away_ts > 0 %}
              {% set elapsed = now_ts - away_ts %}
            {% else %}
              {% set elapsed = 0 %}
            {% endif %}

            {# --------------------------------------------------
              STEP 1: Build definition from AWAY_* labels
              -------------------------------------------------- #}
            {% for lid in labels() %}
              {% set lname = label_name(lid) | upper %}
              {% if lname.startswith('AWAY_') %}
                {% set minutes = lname.replace('AWAY_', '') | int(0) %}
                {% if minutes > 0 %}
                  {% for e in label_entities(lid) %}
                    {% if e.split('.')[0] in ['light','switch','fan','media_player'] %}
                      {% set defs.map = dict(
                        defs.map,
                        **{
                          e: {
                            "domain": e.split('.')[0],
                            "default_sec": minutes * 60,
                            "remaining_sec": minutes * 60,
                            "room": area_name(e) or "No area"
                          }
                        }
                      ) %}
                    {% endif %}
                  {% endfor %}
                {% endif %}
              {% endif %}
            {% endfor %}

            {# --------------------------------------------------
              STEP 2: Runtime logic (remaining_sec + state)
              -------------------------------------------------- #}
            {% set prev = state_attr('sensor.alarm_away_turnoff_runtime','devices') %}
            {% set away = is_state('binary_sensor.occupied_home_1','off') %}
            {% set ns = namespace(map={}) %}

            {% for e, d in defs.map.items() %}
              {% set dev = states[e] %}
              {% set is_on = dev is not none and dev.state not in ['off','idle','standby','unavailable'] %}

              {% if not away %}
                {# HOME → reset #}
                {% set ns.map = dict(
                  ns.map,
                  **{
                    e: {
                      "domain": d.domain,
                      "default_sec": d.default_sec,
                      "remaining_sec": d.default_sec,
                      "room": d.room,
                      "state": "idle"
                    }
                  }
                ) %}
              {% else %}
                {# AWAY → countdown / fire / executed #}

                {% set rem = d.default_sec - elapsed %}
                {% set rem = rem if rem > 0 else 0 %}

                {% if rem > 0 %}
                  {% set state = "running" %}
                {% else %}
                  {% set state = "fire" if is_on else "executed" %}
                {% endif %}

                {% set ns.map = dict(
                  ns.map,
                  **{
                    e: {
                      "domain": d.domain,
                      "default_sec": d.default_sec,
                      "remaining_sec": rem,
                      "room": d.room,
                      "state": state
                    }
                  }
                ) %}
              {% endif %}
            {% endfor %}

            {{ ns.map }}



automation:
  - id: alarm_away_set_start_timestamp
    alias: "ALARM AWAY – set/reset away start timestamp (alarm_ha_away_turnoff)"
    mode: single

    trigger:
      - platform: state
        entity_id: binary_sensor.occupied_home_1

    action:
      - choose:
          # ---------------------------
          # AWAY → Startzeit setzen
          # ---------------------------
          - conditions:
              - condition: state
                entity_id: binary_sensor.occupied_home_1
                state: "off"
            sequence:
              - service: input_number.set_value
                data:
                  entity_id: input_number.away_started_ts
                  value: "{{ now().timestamp() | int }}"
          # ---------------------------
          # HOME → Timer neutralisieren
          # ---------------------------
          - conditions:
              - condition: state
                entity_id: binary_sensor.occupied_home_1
                state: "on"
            sequence:
              - service: input_number.set_value
                data:
                  entity_id: input_number.away_started_ts
                  value: 4102444800   # 2100-01-01 00:00:00
                  

  - id: alarm_away_turnoff_fire_devices
    alias: "ALARM AWAY – turn off FIRE devices (alarm_ha_away_turnoff)"
    mode: parallel

    trigger:
      - platform: time_pattern
        seconds: "/30"   # reicht völlig, kein Sekunden-Loop nötig

    condition:
      - condition: state
        entity_id: binary_sensor.occupied_home_1
        state: "off"

      - condition: template
        value_template: >
          {{ states('input_number.away_started_ts') | float(0) < now().timestamp() }}

    action:
      - variables:
          devices: "{{ state_attr('sensor.alarm_away_devices_definition','devices') | default({}) }}"

      - repeat:
          for_each: "{{ (devices | default({})).items() | list }}"
          sequence:
            - variables:
                entity: "{{ repeat.item[0] }}"
                d: "{{ repeat.item[1] }}"
                dev_state: "{{ states(entity) }}"
            - condition: template
              value_template: >
                {{ d.state == 'fire'
                  and dev_state not in ['off','idle','standby','unavailable'] }}
            - service: homeassistant.turn_off
              target:
                entity_id: "{{ entity }}"

