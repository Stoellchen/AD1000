## Binary Sensor for is anybody at home - guest solution
## https://community.home-assistant.io/t/device-tracker-binary-sensor/54043/10
##  
##  binary_sensor:
##    - platform: template
##      sensors:
##        someone_home:
##          value_template: >
##            {{ is_state('group.all_devices', 'home') or
##               is_state('input_boolean.guest', 'on') }}
##          device_class: presence
##  




group:
  family:
    name: Family
    icon: mdi:home-heart
    entities:
    - group.thomas
    - group.manu

  thomas:
    name: Thomas
    entities:
      # - device_tracker.5t0ll                      #iPhone 17 Pro Max
      - device_tracker.iphone_17
      - person.thomas
    
  manu:
    name: Manu
    entities:
      - device_tracker.manuelas_iphone             #iPhone 11 Plus Max  
      - person.manu



##         or is_state('device_tracker.clodines_phone', 'home')  this hangs at the moment
##      changed on 30.4.24 from device_tracker to person tracker
##
##  Attention: This generates entities like:   binary_sensor.template_occupied_home_1
##  jetzt ist das wieder anders - klappt jetzt!!!!
##
template:
  - binary_sensor:
      - name: person_first
        icon: mdi:account
        state: >
          {% set s = states('person.thomas') | lower %}
          {{ s in ['home', 'home thomas','home garden' ] }}
        attributes:
          source_entity: person.thomas
          source_person: thomas
          raw_state: >
            {{ states('person.thomas') }}
          presence_zone: >
            {% set s = states('person.thomas') | lower %}
            {% if s in ['home', 'home thomas'] %}
              home
            {% elif s in ['garden', 'garten'] %}
              garden
            {% elif s in ['manu', 'home manu'] %}
              manu
            {% else %}
              away
            {% endif %}
  - binary_sensor:
      - name: person_second
        icon: mdi:account
        state: >
          {% set s = states('person.manu') | lower %}
          {{ s in ['home', 'home thomas','home garden' ] }}
        attributes:
          source_entity: person.manu
          source_person: manu
          raw_state: >
            {{ states('person.manu') }}
          presence_zone: >
            {% set s = states('person.manu') | lower %}
            {% if s in ['home', 'home thomas'] %}
              home
            {% elif s in ['garden', 'garten'] %}
              garden
            {% elif s in ['manu', 'home manu'] %}
              manu
            {% else %}
              away
            {% endif %}

  - binary_sensor:
  ## if anybody Manu or Thomas is at home, than the home is occupied
    # Buchserstrasse 5
    - name: occupied_home_1
      device_class: occupancy
      state: >
        {{
          (
            is_state('binary_sensor.person_first', 'on')
            and state_attr('binary_sensor.person_first', 'presence_zone') in ['home', 'garden']
          )
          or
          (
            is_state('binary_sensor.person_second', 'on')
            and state_attr('binary_sensor.person_second', 'presence_zone') in ['home', 'garden']
          )
        }}

    #  oberhausensteig 10 wettswil am albis
    - name: occupied_home_2
      device_class: occupancy
      state: >
          {{
            states('person.thomas') | lower == 'home manu'
            or
            states('person.manu') | lower == 'home manu'
          }}


    # Hinterbergstrasse 56
    - name: occupied_home_3
      device_class: occupancy
      state: >
          {{
            states('person.thomas') | lower == 'hinterberg'
            or
            states('person.manu') | lower == 'hinterberg'
          }}




