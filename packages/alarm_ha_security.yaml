#
# template Alarm Template
# https://www.home-assistant.io/integrations/alarm_control_panel.template/
#
#
# Wenn dies neu ist muss HA neu gestartet werden damit die entity_id erkannt wird.
#


template:
  - binary_sensor:
      - name: "All Security Binary Sensors"
        unique_id: all_security_binary_sensors
        device_class: safety
        state: >
          {% set security_devices = label_devices('security_closed') + 
                                   label_devices('security_closed_24h') + 
                                   label_devices('security_vibration') %}
          {% set entities = security_devices | map('device_entities') | sum(start=[]) | select('match', 'binary_sensor') | list %}
          {{ entities | expand | selectattr('state', 'eq', 'on') | list | count > 0 }}
        attributes:
          security_entities: >
            {% set security_devices = label_devices('security_closed') + 
                                     label_devices('security_closed_24h') + 
                                     label_devices('security_vibration') %}
            {{ security_devices | map('device_entities') | sum(start=[]) | select('match', 'binary_sensor') | list }}


