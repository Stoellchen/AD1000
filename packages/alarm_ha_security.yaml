          - binary_sensor.thirdr1005_occupancy
          - binary_sensor.thirdr1006_occupancy
          - binary_sensor.thirdr1007_occupancy
          - binary_sensor.thirdr1009_occupancy
          - binary_sensor.thirdr3001_occupancy
