          # ... einfach alle sicherheitsrelevanten Sensoren hier rein - werden aber ueber labels gefiltert
        to: "on"
    condition:
      # 1. Bedingung: Ist die Alarmanlage überhaupt scharf geschaltet?
      - condition: or
        conditions:
          - condition: state
            entity_id: alarm_control_panel.my_alarm # Ersetze dies durch deine echte Alarm-ID
            state: "armed_away"
          - condition: state
            entity_id: alarm_control_panel.my_alarm # Ersetze dies durch deine echte Alarm-ID
            state: "armed_home"
          - condition: state
            entity_id: alarm_control_panel.my_alarm # Ersetze dies durch deine echte Alarm-ID
            state: "armed_vacation"
      
      # 2. Bedingung: Gehört der Sensor zu unserer Sicherheits-Liste?
      - condition: template
        value_template: >
          {% set security_list = state_attr('binary_sensor.all_security_binary_sensors', 'security_entities') or [] %}
          {{ trigger.entity_id in security_list }}

    action:
      - service: script.notify_dispatch
        data:
          prio: "H"
          title: "ALARM AUSGELÖST!"
          message: >
            {% set dev_id = device_id(trigger.entity_id) %}
            {% if dev_id in label_devices('security_vibration') %}
              Vibration detektiert an: {{ state_attr(trigger.entity_id, 'friendly_name') }} ({{ area_name(trigger.entity_id) }})!
            {% else %}
              Die Tür/Fenster {{ state_attr(trigger.entity_id, 'friendly_name') }} ({{ area_name(trigger.entity_id) }}) wurde geöffnet!
            {% endif %}
      - service: script.turn_on
        target:
          entity_id: script.alarm_security_alarm_triggered

##########################################################################################
##  Sicherheits-Check Skript (Preflight)
##  Prüft Geräte-Labels: security_closed, security_closed_24h, security_vibration
##########################################################################################

script:
  alarm_ha_security_preflight_check:
    alias: "Sicherheits-Check vor Verlassen (alarm_ha_security)"
    description: "Prüft ob alle Türen zu, Sensoren erreichbar und Batterien voll sind inklusive Bereichsangabe."
    fields:
      duration_long:
        description: "Ist die Abwesenheit länger als 24h? (true/false)"
        example: "true"
    sequence:
      - variables:
          # 1. Geräte sammeln
          dev_closed: "{{ label_devices('security_closed') }}"
          dev_24h: "{{ label_devices('security_closed_24h') if duration_long == 'true' else [] }}"
          dev_vibra: "{{ label_devices('security_vibration') }}"
          
          # 2. Entitäten extrahieren
          check_entities: >
            {{ (dev_closed + dev_24h) | map('device_entities') | sum(start=[]) 
               | select('match', 'binary_sensor') | list }}
          
          all_security_entities: >
            {{ (dev_closed + dev_24h + dev_vibra) | map('device_entities') | sum(start=[]) 
               | select('match', 'binary_sensor') | list }}

          # 3. Listen mit Bereichsnamen über For-Schleifen erstellen
          open_sensors: >
            {% set ns = namespace(items=[]) %}
            {% for entity in check_entities | select('is_state', 'on') %}
              {% set ns.items = ns.items + [ state_attr(entity, 'friendly_name') ~ ' (' ~ (area_name(entity) or 'Kein Bereich') ~ ')' ] %}
            {% endfor %}
            {{ ns.items }}
          
          dead_sensors: >
            {% set ns = namespace(items=[]) %}
            {% for entity in all_security_entities | select('is_state', 'unavailable') %}
              {% set ns.items = ns.items + [ state_attr(entity, 'friendly_name') ~ ' (' ~ (area_name(entity) or 'Kein Bereich') ~ ')' ] %}
            {% endfor %}
            {{ ns.items }}
          
          low_battery: >
            {% set ns = namespace(items=[]) %}
            {% if duration_long == 'true' %}
              {% for entity in all_security_entities | expand | selectattr('attributes.battery', 'defined') | selectattr('attributes.battery', 'lt', 20) %}
                {% set ns.items = ns.items + [ entity.name ~ ' (' ~ (area_name(entity.entity_id) or 'Kein Bereich') ~ ')' ] %}
              {% endfor %}
            {% endif %}
            {{ ns.items }}

          all_issues: "{{ open_sensors + dead_sensors + low_battery }}"

      - if:
          - condition: template
            value_template: "{{ all_issues | count > 0 }}"
        then:
          - service: script.notify_dispatch
            data:
              prio: "H"
              title: "Sicherheits-Check fehlgeschlagen ❌"
              message: >
                Bitte prüfen: {{ all_issues | join(', ') }}. 
                Abwesenheit geplant für: {{ 'Länger als 24h' if duration_long == 'true' else 'Kurztrip' }}.
        else:
          - service: script.notify_dispatch
            data:
              prio: "L"
              title: "Sicherheits-Check OK ✅"
              message: "Alle überwachten Bereiche sind gesichert. Gute Reise!"

