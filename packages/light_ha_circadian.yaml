###############################################################################
#
# Circdadian Override Input Booleans
# Diese Input Booleans werden von Szenen oder manuellen Aktionen aktiviert, um die circadiane Anpassung für einen bestimmten Raum temporär zu deaktivieren.
# Beispiel: Wenn eine Szene "Abendstimmung Wohnzimmer" aktiviert wird, könnte sie den entsprechenden Override-Boolean für das Wohnzimmer einschalten, damit die circadiane Anpassung dort für die Dauer der Szene deaktiviert ist.
# Sobald die Szene oder der manuelle Override endet, wird der Override-Boolean zurückgesetzt, damit die circadiane Anpassung wieder normal funktioniert.
# Diese Logik wird in brain_lights_engine.py implementiert, wo bei Szenenaktivierung die entsprechenden Override-Boolean gesetzt und bei manueller Lichtsteuerung zurückgesetzt werden. 
#
###############################################################################
# 
## -----------------------------------------------------------------------------------------------------------------


input_boolean:
  # Schlafzimmer (1-4)
  override_circadian_schlafzimmer:
    name: "Override Circadian Schlafzimmer"
    icon: mdi:lightbulb-off
