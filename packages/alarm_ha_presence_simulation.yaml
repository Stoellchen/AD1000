#   
# Presence Simulation for Alarm System 
#   
#   https://www.home-assistant.io/integrations/vlc
#   
#   Tutorials
#   Smart Home Junkie's English tutorial: https://youtu.be/OTQu3BMr3EU
#   Tristan's Smartes Heim's German tutorial: https://youtu.be/5vCp3iKZb4Q
#   HectorziN Domótica's Spanish tutorial: https://youtu.be/2N7aihhnkNg
#   
#   

## How to use:
#   1. Assign the label `presence` to any entity you want to include
#      in the presence simulation (lights, media players, switches, etc.)
#   2. The group `group.presence_simulationen_group` will be automatically
#      populated with those entities.
#   3. Use this group in your presence simulation automations or scripts.
#   4. The group updates automatically on HA start and every 5 minutes.
#   5. You can check the group members in Developer Tools > States.
#   6. Adjust the update interval in the automation if needed.
#   7. Enjoy enhanced security with dynamic presence simulation!
#   Note: Ensure that the label name `presence` matches exactly.
################################################################################
# Der switch um die presence simulation zu aktivieren/deaktivieren
# der Sitch wird automatisch von der integration erstellt und kann soll umbenannt werden
# in der Automation verwendet werden um die presence simulation zu aktivieren/deaktivieren
#   input_boolean:
#     presence_simulation_activ:                     #  Wird in der Alarm Automation verwendet um die Presence Simulation zu aktivieren/deaktivieren
#       name: Presence Simulation Aktivieren
#       icon: mdi:home-automation
#   


input_select:
  presence_simulation_profile:
    name: Presence Simulation Profile
    options:
      - off
      - armed_home
      - armed_away
      - armed_night
      - armed_vacation
      - armed_custom_bypass


template:
  - sensor:
      - name: "Presence Simulation Active Devices"
        unit_of_measurement: "count"
#        state_class: measurement
#        attributes:
#          description: "Number of active devices in the presence simulation group (alarm_ha_presence_simulation)"
        state: >
          {% if is_state('switch.presence_simulation', 'on') %}
            {{ expand('group.presence_simulationen_group')
               | selectattr('state','eq','on')
               | list | count }}
          {% else %}
            0
          {% endif %}




group:
  presence_simulationen_target:                        #  wird automatisch mit entites gefüllt welche ein bestimmtes label haben
    name: "Presence Simulation Group TARGET for use in presence simulation service (alarm_ha_presence_simulation)"
    entities:
      - light.dummy
  presence_simulationen_group_away:                        #  wird automatisch mit entites gefüllt welche ein bestimmtes label haben
    name: "Presence Simulation Group AWAY (Dynamic - label presence) (alarm_ha_presence_simulation)"
    entities:
      - light.dummy
  presence_simulationen_group_near:                        #  wird automatisch mit entites gefüllt welche ein bestimmtes label haben
    name: "Presence Simulation Group NEAR (Dynamic - label presence_near) (alarm_ha_presence_simulation)"
    entities:
      - light.dummy
  presence_simulationen_group_far:                        #  wird automatisch mit entites gefüllt welche ein bestimmtes label haben
    name: "Presence Simulation Group FAR (Dynamic - label presence_far) (alarm_ha_presence_simulation)"
    entities:
      - light.dummy
  presence_simulationen_group_night:                        #  wird automatisch mit entites gefüllt welche ein bestimmtes label haben
    name: "Presence Simulation Group NIGHT (Dynamic - label presence_night) (alarm_ha_presence_simulation)"
    entities:
      - light.kerze
      - switch.lichterkette_wohnzimmer
      - switch.fake_tv
  presence_simulationen_group_vacation:                        #  wird automatisch mit entites gefüllt welche ein bestimmtes label haben
    name: "Presence Simulation Group VACATION (Dynamic - label presence_vacation) (alarm_ha_presence_simulation)"
    entities:
      - light.kerze
      - switch.lichterkette_wohnzimmer
      - switch.fake_tv
  presence_simulationen_group_by_pass:                        #  wird automatisch mit entites gefüllt welche ein bestimmtes label haben
    name: "Presence Simulation Group BY_PASS (Dynamic - label presence_by_pass) (alarm_ha_presence_simulation)"
    entities:
      - light.kerze
      - switch.lichterkette_wohnzimmer
      - switch.fake_tv


