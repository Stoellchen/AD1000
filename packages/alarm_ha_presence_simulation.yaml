###############################################################################
# Presence Simulation – Dynamic Group Update
#
# Purpose:
#   Dynamically builds and maintains the group
#   `group.presence_simulationen_group` based on Home Assistant Labels.
#
# How it works:
#   - Uses Home Assistant's built-in `label_entities()` helper
#   - Collects all entities tagged with the label: `presence`
#   - Replaces the group content atomically using `group.set`
#
# Why this approach:
#   - No hardcoded entity lists
#   - Automatically adapts to new / removed entities
#   - No dependency on device_id or attributes
#   - Safe, fast, and officially supported by Home Assistant
#
# Notes:
#   - The label name is intentionally spelled `presence`
#     (must match the label exactly as defined in HA)
#   - `group.set` always overwrites the full group
#   - `object_id` must be given WITHOUT the `group.` prefix
#
# Update triggers:
#   - On Home Assistant startup
#   - Every 5 minutes (can be adjusted)
###############################################################################

#     Build entity list dynamically from label `presence`
#     {% set ns = namespace(list=[]) %}
#     {% for entity in label_entities('presence') %}
#       {% set ns.list = ns.list + [entity] %}
#     {% endfor %}
#     {{ ns.list }}



automation:
  - id: presence_simulation_update_group
    alias: "Presence Simulation – Update Entity Group (alarm_ha_presence_simulation)"
    mode: single

    trigger:
      # Update group on Home Assistant start
      - platform: homeassistant
        event: start
      - platform: event
        event_type: automation_reloaded

      # Periodic refresh to catch label changes
      - platform: time_pattern
        minutes: "/5"

    action:
      - service: group.set
        data:
          # Resulting group entity:
          #   group.presence_simulationen_group enthält near und far
          object_id: presence_simulationen_group_away

          # Build entity list dynamically from label `presence_vaf` oder `presence_near`
          entities: >
            {% set ns = namespace(list=[]) %}

            {% for entity in label_entities('presence_near') %}
              {% set ns.list = ns.list + [entity] %}
            {% endfor %}

            {% for entity in label_entities('presence_far') %}
              {% if entity not in ns.list %}
                {% set ns.list = ns.list + [entity] %}
              {% endif %}
            {% endfor %}

            {% for entity in label_entities('presence_night') %}
              {% if entity not in ns.list %}
                {% set ns.list = ns.list + [entity] %}
              {% endif %}
            {% endfor %}

            {{ ns.list }}

      - service: group.set
        data:
          # Resulting group entity:
          #   group.presence_simulationen_group_near
          object_id: presence_simulationen_group_near

          # Build entity list dynamically from label `presence_near`
          entities: >
            {% set ns = namespace(list=[]) %}
            {% for entity in label_entities('presence_near') %}
              {% set ns.list = ns.list + [entity] %}
            {% endfor %}
            {{ ns.list }}

      - service: group.set
        data:
          # Resulting group entity:
          #   group.presence_simulationen_group_far
          object_id: presence_simulationen_group_far

          # Build entity list dynamically from label `presence_far`
          entities: >
            {% set ns = namespace(list=[]) %}
            {% for entity in label_entities('presence_far') %}
              {% set ns.list = ns.list + [entity] %}
            {% endfor %}
            {{ ns.list }}

      - service: group.set
        data:
          # Resulting group entity:
          #   group.presence_simulationen_group_far
          object_id: presence_simulationen_group_night

          # Build entity list dynamically from label `presence_far`
          entities: >
            {% set ns = namespace(list=[]) %}
            {% for entity in label_entities('presence_night') %}
              {% set ns.list = ns.list + [entity] %}
            {% endfor %}
            {{ ns.list }}

      - service: group.set
        data:
          # Resulting group entity:
          #   group.presence_simulationen_group enthält near und far
          object_id: presence_simulationen_group_vacation

          # Build entity list dynamically from label `presence_far` oder `presence_near`
          entities: >
            {% set ns = namespace(list=[]) %}

            {% for entity in label_entities('presence_near') %}
              {% set ns.list = ns.list + [entity] %}
            {% endfor %}

            {% for entity in label_entities('presence_far') %}
              {% if entity not in ns.list %}
                {% set ns.list = ns.list + [entity] %}
              {% endif %}
            {% endfor %}

            {% for entity in label_entities('presence_night') %}
              {% if entity not in ns.list %}
                {% set ns.list = ns.list + [entity] %}
              {% endif %}
            {% endfor %}

            {{ ns.list }}

      - service: group.set
        data:
          # Resulting group entity:
          #   group.presence_simulationen_group enthält near und far
          object_id: presence_simulationen_group_by_pass

          # Build entity list dynamically from label `presence_far` oder `presence_near`
          entities: >
            {% set ns = namespace(list=[]) %}

            {% for entity in label_entities('presence_near') %}
              {% set ns.list = ns.list + [entity] %}
            {% endfor %}

            {% for entity in label_entities('presence_far') %}
              {% if entity not in ns.list %}
                {% set ns.list = ns.list + [entity] %}
              {% endif %}
            {% endfor %}

            {% for entity in label_entities('presence_night') %}
              {% if entity not in ns.list %}
                {% set ns.list = ns.list + [entity] %}
              {% endif %}
            {% endfor %}

            {{ ns.list }}



  - id: presence_simulation_profile_switch
    alias: "Presence Simulation – Switch Profile (alarm_ha_presence_simulation)"
    mode: single
    trigger:
      - platform: state
        entity_id: input_select.presence_simulation_profile
    action:
      - choose:
          # ----------------------------------------------------
          # AWAY → NEAR + FAR
          # ----------------------------------------------------
          - conditions:
              - condition: state
                entity_id: input_select.presence_simulation_profile
                state: armed_away
            sequence:
              - service: group.set
                data:
                  object_id: presence_simulationen_target
                  entities: "{{ states.group.presence_simulationen_group_away.attributes.entity_id }}"
          # ----------------------------------------------------
          # HOME → FAR
          # ----------------------------------------------------
          - conditions:
              - condition: state
                entity_id: input_select.presence_simulation_profile
                state: armed_home
            sequence:
              - service: group.set
                data:
                  object_id: presence_simulationen_target
                  entities: "{{ states.group.presence_simulationen_group_far.attributes.entity_id }}"
          # ----------------------------------------------------
          # NIGHT → FAR only
          # ----------------------------------------------------
          - conditions:
              - condition: state
                entity_id: input_select.presence_simulation_profile
                state: armed_night
            sequence:
              - service: group.set
                data:
                  object_id: presence_simulationen_target
                  entities: "{{ states.group.presence_simulationen_group_night.attributes.entity_id }}"
          # ----------------------------------------------------
          # VACATION → FAR only
          # ----------------------------------------------------
          - conditions:
              - condition: state
                entity_id: input_select.presence_simulation_profile
                state: armed_vacation
            sequence:
              - service: group.set
                data:
                  object_id: presence_simulationen_target
                  entities: "{{ states.group.presence_simulationen_group_vacation.attributes.entity_id }}"
          # ----------------------------------------------------
          # BY_PASS → FAR only
          # ----------------------------------------------------
          - conditions:
              - condition: state
                entity_id: input_select.presence_simulation_profile
                state: armed_custom_bypass
            sequence:
              - service: group.set
                data:
                  object_id: presence_simulationen_target
                  entities: "{{ states.group.presence_simulationen_group_by_pass.attributes.entity_id }}"
        default:
          - service: script.turn_on
            metadata: {}
            data: {}
            target:
              entity_id: script.alarm_turn_presence_simulation_off



  - id: alarm_presence_profile_sync
    alias: "ALARM → Presence Simulation Profile Sync (alarm_ha_presence_simulation)"
    mode: single
    trigger:
      - platform: state
        entity_id: alarm_control_panel.my_alarm
        to:
          - armed_away
          - armed_home
          - armed_night
          - armed_vacation
          - armed_custom_bypass
    action:
      - choose:
          # --------------------------------------------------
          # ARMED NIGHT → Presence NIGHT
          # --------------------------------------------------
          - conditions:
              - condition: state
                entity_id: alarm_control_panel.my_alarm
                state: armed_night
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.presence_simulation_profile
                  option: armed_night
          # --------------------------------------------------
          # ARMED AWAY → Presence AWAY
          # --------------------------------------------------
          - conditions:
              - condition: state
                entity_id: alarm_control_panel.my_alarm
                state: armed_away
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.presence_simulation_profile
                  option: armed_away
          # --------------------------------------------------
          # ARMED HOME → Presence HOME (armed)
          # --------------------------------------------------
          - conditions:
              - condition: state
                entity_id: alarm_control_panel.my_alarm
                state: armed_home
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.presence_simulation_profile
                  option: armed_home
          # --------------------------------------------------
          # ARMED VACATION → Presence VACATION
          # --------------------------------------------------
          - conditions:
              - condition: state
                entity_id: alarm_control_panel.my_alarm
                state: armed_vacation
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.presence_simulation_profile
                  option: armed_vacation

          # --------------------------------------------------
          # DISARMED → Presence OFF
          # --------------------------------------------------
          - conditions:
              - condition: state
                entity_id: alarm_control_panel.my_alarm
                state: disarmed
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.presence_simulation_profile
                  option: off



  - id: presence_simulation_activity_monitor
    alias: "Presence Simulation – Activity Monitor (alarm_ha_presence_simulation)"
    mode: queued
    max: 50

    trigger:
      - platform: event
        event_type: state_changed


    condition:
      # Presence Simulation aktiv
      - condition: state
        entity_id: switch.presence_simulation
        state: "on"

      # gültiger Statewechsel
      - condition: template
        value_template: >
          {{ trigger.event.data.old_state is not none
            and trigger.event.data.new_state is not none
            and trigger.event.data.old_state.state
                != trigger.event.data.new_state.state }}

      # nur relevante Domains
      - condition: template
        value_template: >
          {{ trigger.event.data.entity_id.split('.')[0]
            in ['light','switch','media_player','fan'] }}

      # nur Target-Gruppe (robust!)
      - condition: template
        value_template: >
          {% set targets = state_attr('group.presence_simulationen_target', 'entity_id') %}
          {{ targets is iterable and trigger.event.data.entity_id in targets }}


    action:
      - variables:
          entity: "{{ trigger.event.data.entity_id }}"
          old: "{{ trigger.event.data.old_state.state }}"
          new: "{{ trigger.event.data.new_state.state }}"
          name: "{{ state_attr(entity, 'friendly_name') or entity }}"
          room: "{{ area_name(entity) or 'unknown' }}"

      # erstmal Log (Debug / Nachweis)
      - service: system_log.write
        data:
          level: info
          message: >
            [PresenceSimulation] {{ name }} ({{ entity }}, {{ room }})
            {{ old }} → {{ new }}
      - service: logbook.log
        data:
          name: "Presence Simulation"
          message: >
            {{ name }} ({{ room }}) {{ old }} → {{ new }}
          entity_id: "{{ entity }}"


