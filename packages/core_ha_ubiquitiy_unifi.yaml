################################################################################
#   
# core_ha_ubiquitiy_unifi.yaml
#   
# https://www.home-assistant.io/integrations/unifi_direct

device_tracker:
  - platform: unifi_direct
    host: !secret ubiquity_unifi_ap_01_ip
    username: !secret ubiquity_unifi_ap_01_ssh_user
    password: !secret ubiquity_unifi_ap_01_ssh_password
    interval_seconds: 10
    consider_home: 180
    new_device_defaults:
      track_new_devices: true



