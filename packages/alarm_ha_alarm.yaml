  alarm_flash_status_lights:
    alias: "Alarm Status-Blinken (alarm_ha_alarm)"
    description: "Blinkt basierend auf dem Sonnenstand (Nachts dunkel, Tags hell)"
    mode: restart  # <--- Bricht laufende Instanz ab und startet neu
    fields:
      color:
        description: "Farbe (red, green, orange)"
        example: "red"
      flash_count:
        description: "Anzahl der Blink-Zyklen"
        example: 5
    sequence:
      - variables:
          # 1. Helligkeit über Sonnen-Elevation bestimmen
          # Elevation < 0 bedeutet Sonne ist unter dem Horizont (Nacht/Dämmerung)
          sun_elevation: "{{ state_attr('sun.sun', 'elevation') | float(0) }}"
          target_brightness: >
            {% if sun_elevation < 0 %} 5 {% else %} 100 {% endif %}
          
          # 2. Ziel-Entitäten aus der dynamischen Gruppe
          target_entities: "{{ state_attr('group.alarm_status_light', 'entity_id') }}"
          
          # 3. Standardwert für Zyklen
          final_count: "{{ flash_count | default(3) | int }}"

      - repeat:
          count: "{{ final_count }}"
          sequence:
            - service: light.turn_on
              data:
                color_name: "{{ color }}"
                brightness_pct: "{{ target_brightness }}"
              target:
                entity_id: "{{ target_entities }}"
            - delay: "00:00:01"
            - service: light.turn_off
              target:
                entity_id: "{{ target_entities }}"
            - delay: "00:00:01"
            
      # Finaler Check: Sicherstellen, dass alles aus ist
      - service: light.turn_off
        target:
          entity_id: "{{ target_entities }}"


  alarm_flash_status_lights_transition:
    alias: "Alarm Status-Übergang (alarm_ha_alarm)"
    description: "Wechselblinklicht zwischen zwei Farben für Statusübergänge"
    mode: restart  # <--- Bricht laufende Instanz ab und startet neu
    fields:
      color_1:
        description: "Erste Farbe (z.B. green oder orange)"
        example: "green"
      color_2:
        description: "Zweite Farbe (z.B. red)"
        example: "red"
      flash_count:
        description: "Anzahl der Wechsel-Zyklen (1 Zyklus = 3 Sekunden)"
        example: 5
    sequence:
      - variables:
          # 1. Helligkeit über Sonnen-Elevation bestimmen (Tag 100%, Nacht 5%)
          sun_elevation: "{{ state_attr('sun.sun', 'elevation') | float(0) }}"
          target_brightness: >
            {% if sun_elevation < 0 %} 5 {% else %} 100 {% endif %}
          
          # 2. Ziel-Entitäten aus der dynamischen Gruppe
          target_entities: "{{ state_attr('group.alarm_status_light', 'entity_id') }}"
          
          # 3. Standardwert für Zyklen
          final_count: "{{ flash_count | default(3) | int }}"

      - repeat:
          count: "{{ final_count }}"
          sequence:
            # Farbe 1 für 2 Sekunden einschalten
            - service: light.turn_on
              data:
                color_name: "{{ color_1 }}"
                brightness_pct: "{{ target_brightness }}"
              target:
                entity_id: "{{ target_entities }}"
            - delay: "00:00:02"

            # Farbe 2 für 1 Sekunde einschalten
            - service: light.turn_on
              data:
                color_name: "{{ color_2 }}"
                brightness_pct: "{{ target_brightness }}"
              target:
                entity_id: "{{ target_entities }}"
            - delay: "00:00:01"
            
      # Finaler Check: Sicherstellen, dass nach dem Ablauf alles aus ist
      - service: light.turn_off
        target:
          entity_id: "{{ target_entities }}"

