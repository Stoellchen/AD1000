views:
  - type: sections
    max_columns: 3
    title: Übersicht
    path: overview
    icon: mdi:traffic-light-outline
    sections:
      - type: grid
        cards:
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                icon: mdi:cpu-64-bit
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-system/system
                name: |
                  [[[
                    const v = parseFloat(states['sensor.system_monitor_prozessornutzung']?.state);
                    if (isNaN(v)) return 'keine Daten';
                    return 'ad1000 CPU:  ' + v.toFixed(1) + ' %';
                  ]]]
                state_display: |
                  [[[
                    const v = parseFloat(states['sensor.system_monitor_prozessornutzung']?.state);
                    if (isNaN(v)) return 'keine Daten';
                    return v.toFixed(1) + ' %';
                  ]]]
                styles:
                  card:
                    - background-color: |
                        [[[
                          const v = parseFloat(states['sensor.system_monitor_prozessornutzung']?.state);
                          if (isNaN(v)) return 'rgba(80,80,80,0.6)';

                          // 0 % (grün) → 50 % (rot)
                          const t = Math.min(Math.max(v / 50, 0), 1);

                          const r = Math.round(0 + t * 180);
                          const g = Math.round(180 + t * (0 - 180));
                          const b = Math.round(80 + t * (0 - 80));

                          return `rgba(${r},${g},${b},0.85)`;
                        ]]]
                  name:
                    - color: white
                  state:
                    - color: white
              - type: custom:button-card
                icon: mdi:memory
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-system/system
                name: |
                  [[[
                    const v = parseFloat(states['sensor.system_monitor_arbeitsspeicherauslastung']?.state);
                    if (isNaN(v)) return 'ad1000: keine Daten';
                    return 'ad1000 RAM: ' + v.toFixed(1) + ' %';
                  ]]]
                state_display: |
                  [[[
                    const v = parseFloat(states['sensor.system_monitor_arbeitsspeicherauslastung']?.state);
                    if (isNaN(v)) return 'keine Daten';
                    return v.toFixed(1) + ' %';
                  ]]]
                styles:
                  card:
                    - background-color: |
                        [[[
                          const v = parseFloat(states['sensor.system_monitor_prozessornutzung']?.state);
                          if (isNaN(v)) return 'rgba(80,80,80,0.6)';

                          // 0 % (grün) → 100 % (rot)
                          const t = Math.min(Math.max(v / 50, 0), 1);

                          const r = Math.round(0 + t * 180);
                          const g = Math.round(180 + t * (0 - 180));
                          const b = Math.round(80 + t * (0 - 80));

                          return `rgba(${r},${g},${b},0.85)`;
                        ]]]
                  name:
                    - color: white
                  state:
                    - color: white
      - type: grid
        cards:
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                entity: sensor.influx_last_seen_min
                name: Influx
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-system/influx-detail
                icon: mdi:traffic-light
                show_state: false
                show_name: true
                styles:
                  card:
                    - border-radius: 12px
                    - padding: 16px
                    - font-size: 16px
                    - color: white
                  icon:
                    - width: 48px
                  name:
                    - font-weight: bold
                    - font-size: 18px
                state:
                  - operator: template
                    value: |
                      [[[
                        return entity?.attributes?.status === 'green';
                      ]]]
                    styles:
                      card:
                        - background-color: '#2ecc71'
                  - operator: template
                    value: |
                      [[[
                        return entity?.attributes?.status === 'orange';
                      ]]]
                    styles:
                      card:
                        - background-color: '#f39c12'
                  - operator: template
                    value: |
                      [[[
                        return entity?.attributes?.status === 'red';
                      ]]]
                    styles:
                      card:
                        - background-color: '#e74c3c'
                  - operator: template
                    value: |
                      [[[
                        return entity?.attributes?.status === 'offline';
                      ]]]
                    styles:
                      card:
                        - background-color: '#7f8c8d'
              - show_name: true
                show_icon: true
                type: button
                icon: mdi:link
                tap_action:
                  action: url
                  url_path: http://vminfluxdb001.main.arpa:8086
                color: red
                name: Server
            grid_options:
              columns: 12
              rows: 2
      - type: grid
        cards:
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                entity: sensor.emqx_mqtt_status
                name: MQTT
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-system/mqtt-detail
                icon: mdi:traffic-light
                show_state: false
                show_name: true
                styles:
                  card:
                    - border-radius: 12px
                    - padding: 16px
                    - font-size: 16px
                    - color: white
                  icon:
                    - width: 48px
                  name:
                    - font-weight: bold
                    - font-size: 18px
                state:
                  - value: green
                    styles:
                      card:
                        - background-color: '#2ecc71'
                  - value: yellow
                    styles:
                      card:
                        - background-color: '#f1c40f'
                  - value: red
                    styles:
                      card:
                        - background-color: '#e74c3c'
                  - value: offline
                    styles:
                      card:
                        - background-color: '#7f8c8d'
              - show_name: true
                show_icon: true
                type: button
                icon: mdi:link
                tap_action:
                  action: url
                  url_path: http://emqx001.main.arpa:18083
                color: red
                name: Server
      - type: grid
        cards:
          - type: custom:button-card
            icon: mdi:network-outline
            tap_action:
              action: navigate
              navigation_path: /dashboard-system/pings
            name: |
              [[[
                const sensors = Object.values(states).filter(e =>
                  e.entity_id.startsWith('sensor.') &&
                  e.entity_id.endsWith('_durchschnittliche_umlaufzeit') &&
                  !['unknown','unavailable'].includes(e.state)
                );

                if (sensors.length === 0) return 'Umlaufzeit (keine Daten)';

                const avg =
                  sensors.reduce((sum, e) => sum + parseFloat(e.state), 0) / sensors.length;

                return `Umlaufzeit (${sensors.length} Geräte · Ø ${avg.toFixed(2)} ms)`;
              ]]]
            state_display: |
              [[[
                const sensors = Object.values(states).filter(e =>
                  e.entity_id.startsWith('sensor.') &&
                  e.entity_id.endsWith('_durchschnittliche_umlaufzeit') &&
                  !['unknown','unavailable'].includes(e.state)
                );

                if (sensors.length === 0) return 'keine Daten';

                const avg =
                  sensors.reduce((sum, e) => sum + parseFloat(e.state), 0) / sensors.length;

                return avg.toFixed(2) + ' ms';
              ]]]
            styles:
              card:
                - background-color: |
                    [[[
                      const sensors = Object.values(states).filter(e =>
                        e.entity_id.startsWith('sensor.') &&
                        e.entity_id.endsWith('_durchschnittliche_umlaufzeit') &&
                        !['unknown','unavailable'].includes(e.state)
                      );

                      if (sensors.length === 0)
                        return 'rgba(80,80,80,0.6)';

                      const avg =
                        sensors.reduce((sum, e) => sum + parseFloat(e.state), 0) / sensors.length;

                      // Verlauf 0 ms (grün) → 20 ms (rot)
                      const t = Math.min(Math.max(avg / 10, 0), 1);

                      const r = Math.round(0 + t * (180 - 0));
                      const g = Math.round(180 + t * (0 - 180));
                      const b = Math.round(80 + t * (0 - 80));

                      return `rgba(${r},${g},${b},0.85)`;
                    ]]]
              name:
                - color: white
              state:
                - color: white
      - type: grid
        cards:
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                icon: mdi:battery
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-system/sensoren
                name: |
                  [[[
                    const sensors = Object.values(states).filter(e =>
                      e.entity_id.startsWith('sensor.') &&
                      e.entity_id.endsWith('_battery') &&
                      !['unknown','unavailable'].includes(e.state)
                    );

                    if (sensors.length === 0) return 'Batterien <br>(keine Daten)';

                    const values = sensors.map(e => parseFloat(e.state));
                    const min = Math.min(...values);

                    return `Sensoren: Batteriestatus <br>(${sensors.length} Geräte · min ${min.toFixed(0)} %)`;
                  ]]]
                state_display: |
                  [[[
                    const sensors = Object.values(states).filter(e =>
                      e.entity_id.startsWith('sensor.') &&
                      e.entity_id.endsWith('_battery') &&
                      !['unknown','unavailable'].includes(e.state)
                    );

                    if (sensors.length === 0) return 'keine Daten';

                    const values = sensors.map(e => parseFloat(e.state));
                    const min = Math.min(...values);

                    return `${min.toFixed(0)} %`;
                  ]]]
                styles:
                  card:
                    - background-color: |
                        [[[
                          const sensors = Object.values(states).filter(e =>
                            e.entity_id.startsWith('sensor.') &&
                            e.entity_id.endsWith('_battery') &&
                            !['unknown','unavailable'].includes(e.state)
                          );

                          if (sensors.length === 0) return 'rgba(80,80,80,0.6)';

                          const values = sensors.map(e => parseFloat(e.state));
                          const min = Math.min(...values);

                          return min < 30
                            ? 'rgba(180,0,0,0.85)'   // rot
                            : 'rgba(0,160,80,0.85)'; // grün
                        ]]]
                  name:
                    - color: white
                  state:
                    - color: white
              - type: custom:button-card
                icon: mdi:home-lightning-bolt
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-system/lights-switches
                name: |
                  [[[
                    const entities = Object.values(states).filter(e =>
                      (e.entity_id.startsWith('light.') || e.entity_id.startsWith('switch.'))
                    );

                    if (entities.length === 0)
                      return 'Lichter & Switches <br>(keine Daten)';

                    return `Lichter & Switches <br>(${entities.length} Geräte)`;
                  ]]]
                state_display: |
                  [[[
                    const entities = Object.values(states).filter(e =>
                      (e.entity_id.startsWith('light.') || e.entity_id.startsWith('switch.'))
                    );

                    if (entities.length === 0)
                      return 'keine Daten';

                    const bad = entities.filter(e =>
                      !['on','off'].includes(e.state)
                    );

                    return bad.length === 0
                      ? 'alle OK'
                      : `${bad.length} Problem(e)`;
                  ]]]
                styles:
                  card:
                    - background-color: |
                        [[[
                          const entities = Object.values(states).filter(e =>
                            (e.entity_id.startsWith('light.') || e.entity_id.startsWith('switch.'))
                          );

                          if (entities.length === 0)
                            return 'rgba(80,80,80,0.6)';

                          const bad = entities.some(e =>
                            !['on','off'].includes(e.state)
                          );

                          return bad
                            ? 'rgba(180,0,0,0.85)'   // rot
                            : 'rgba(0,160,80,0.85)'; // grün
                        ]]]
                  name:
                    - color: white
                  state:
                    - color: white
          - type: heading
            icon: mdi:fridge
            heading_style: subtitle
            heading: Eles Plug 2 ist nicht verbunden
    cards: []
    header:
      card:
        type: markdown
        text_only: true
        content: '# {{ user }} unser Healthcheck ✨'
    dense_section_placement: true
  - type: sections
    max_columns: 4
    title: System
    path: system
    sections:
      - type: grid
        cards:
          - type: gauge
            entity: sensor.system_monitor_prozessornutzung
            grid_options:
              columns: 6
              rows: auto
            unit: '%'
            name: CPU
          - type: gauge
            entity: sensor.system_monitor_arbeitsspeicherauslastung
            grid_options:
              columns: 6
              rows: auto
            unit: '%'
            name: RAM
          - chart_type: line
            period: 5minute
            type: statistics-graph
            entities:
              - sensor.system_monitor_prozessornutzung
              - sensor.system_monitor_arbeitsspeicherauslastung
              - sensor.system_monitor_swap_auslastung
            stat_types:
              - max
              - min
              - mean
            logarithmic_scale: true
            days_to_show: 12
      - type: grid
        cards:
          - show_name: true
            show_icon: true
            type: button
            icon: mdi:lighthouse-on
            tap_action:
              action: navigate
              navigation_path: /dashboard-system
            name: System Übersicht
            show_state: true
            grid_options:
              rows: 2
    icon: mdi:cpu-64-bit
    cards: []
    header:
      card:
        type: markdown
        text_only: true
        content: '# {{ user }}, Healthcheck für ad1000 ✨'
