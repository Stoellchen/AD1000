  - type: sections
    max_columns: 3
    title: Energy
    path: energy
    icon: mdi:sine-wave
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Energy
            heading_style: subtitle
            icon: mdi:flash
          - type: custom:auto-entities
            card:
              type: grid
              columns: 2
            card_param: cards
            filter:
              include:
                - options:
                    type: gauge
                    min: 0
                    max: 100
                    severity:
                      red: 1000
                      yellow: 200
                      green: 1
                    entities:
                      - this.entity_id
                  entity_id: sensor.*_power
                  sort:
                    method: last_changed
              exclude:
                - options: {}
                  entity_id: switch.eles_smart_plug_2_steckdose_1
      - type: grid
        cards:
          - type: heading
            heading: Current
            heading_style: subtitle
            icon: mdi:generator-mobile
          - type: custom:auto-entities
            card:
              type: grid
              columns: 2
            card_param: cards
            filter:
              include:
                - options:
                    type: gauge
                    min: 0
                    max: 1.5
                    severity:
                      red: 5
                      yellow: 0.5
                      green: 0.01
                    entities:
                      - this.entity_id
                  entity_id: sensor.*_current
                  sort:
                    method: last_changed
              exclude:
                - options: {}
                  entity_id: switch.eles_smart_plug_2_steckdose_1
      - type: grid
        cards:
          - type: heading
            heading: Current
            heading_style: subtitle
          - type: custom:auto-entities
            card:
              type: grid
              columns: 2
            card_param: cards
            filter:
              include:
                - options:
                    type: statistics-graph
                    period: 5minute
                    stat_types:
                      - max
                    logarithmic_scale: true
                    days_to_show: 12
                    entities:
                      - this.entity_id
                  entity_id: sensor.*_current
                  sort:
