            chips:
              - type: entity
                entity: binary_sensor.influx_alive
                name: Influx
              - type: entity
                entity: sensor.influx_last_seen_min
                name: Last Seen
              - type: entity
                entity: sensor.ha_heartbeat
                name: HA → Influx
