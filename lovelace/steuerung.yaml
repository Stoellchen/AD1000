      - type: grid
        cards:
          - type: vertical-stack
            cards:
              - type: entities
                title: Timer – Übersteuerung
                entities:
                  - entity: input_number.autotimer_helper
                    name: Überschreiben
              - type: custom:auto-entities
                card:
                  type: vertical-stack
                card_param: cards
                filter:
                  include:
                    - group: group.autotimer_target
                      options:
                        type: custom:mushroom-template-card
                        entity: this.entity_id
                        layout: horizontal
                        icon: >
                          {% set s = states(entity) %} {% set domain =
                          entity.split('.')[0] %}

                          {% if domain == 'switch' %}
                            {{ 'mdi:power-plug-outline' if s == 'on' else 'mdi:power-plug-off-outline' }}

                          {% elif domain == 'light' %}
                            {{ 'mdi:lightbulb' if s == 'on' else 'mdi:lightbulb-off' }}

                          {% elif domain == 'media_player' %}
                            {{ 'mdi:play-circle' if s in ['playing','on'] else 'mdi:television-off' }}

                          {% elif domain == 'fan' %}
                            {{ 'mdi:fan' if s == 'on' else 'mdi:fan-off' }}

                          {% else %}
                            {{ 'mdi:cog' if s == 'on' else 'mdi:cog-outline' }}
                          {% endif %}
                        primary: |
                          {{ state_attr(entity,'friendly_name') }}
                        secondary: >

                          {% set d = state_attr('pyscript.autotimer_status',
                          entity) %}

                          {% if d and d.active %}
                            {% set sec = d.remaining_sec | int %}
                            {% set h = sec // 3600 %}
                            {% set m = (sec % 3600) // 60 %}
                            {% set s = sec % 60 %}

                            ⏱
                            {% if h > 0 %}
                              {{ '%d:%02d:%02d' | format(h, m, s) }}
                            {% else %}
                              {{ '%02d:%02d' | format(m, s) }}
                            {% endif %}
                            of
                            {% if d.default_sec >= 3600 %}
                              ({{ (d.default_sec // 3600) }} h {{ ((d.default_sec % 3600) // 60) }} min)
                            {% else %}
                              ({{ (d.default_sec // 60) }} min)
                            {% endif %}

                          {% elif d %}
                            {% if d.default_sec >= 3600 %}
                              ({{ (d.default_sec // 3600) }} h {{ ((d.default_sec % 3600) // 60) }} min)
                            {% else %}
                              ({{ (d.default_sec // 60) }} min)
                            {% endif %}
                          {% else %}
                            —
                          {% endif %}
                           · {{ area_name(entity) }}
                           
                        icon_color: >

                          {% set d = state_attr('pyscript.autotimer_status',
                          entity) %} {% if not d or not d.active or
                          d.default_sec == 0 %}
                            grey
                          {% else %}
                            {% set pct = (d.remaining_sec / d.default_sec * 100) | round(0) %}

                            {% if pct > 90 %}
                              green
                            {% elif pct > 80 %}
                              light-green
                            {% elif pct > 70 %}
                              green
                            {% elif pct > 60 %}
                              yellow
                            {% elif pct > 50 %}
                              yellow
                            {% elif pct > 40 %}
                              amber
                            {% elif pct > 30 %}
                              orange
                            {% elif pct > 20 %}
                              deep-orange
                            {% elif pct > 10 %}
                              red
                            {% else %}
                              red
                            {% endif %}
                          {% endif %}
                        tap_action:
                          action: call-service
                          service: pyscript.autotimer_start
                          data:
                            entity_id: this.entity_id
                        hold_action:
                          action: call-service
                          service: pyscript.autotimer_stop
                          data:
                            entity_id: this.entity_id
                        double_tap_action:
                          action: call-service
                          service: pyscript.autotimer_start
                          data:
                            entity_id: this.entity_id
