                    - color: white
                  icon:
                    - width: 48px
                  name:
                    - font-weight: bold
                    - font-size: 18px
                state:
                  - operator: template
                    value: |
                      [[[
                        return entity?.attributes?.status === 'green';
                      ]]]
                    styles:
                      card:
                        - background-color: '#2ecc71'
                  - operator: template
                    value: |
                      [[[
                        return entity?.attributes?.status === 'orange';
                      ]]]
                    styles:
                      card:
                        - background-color: '#f39c12'
                  - operator: template
                    value: |
                      [[[
                        return entity?.attributes?.status === 'red';
                      ]]]
                    styles:
                      card:
                        - background-color: '#e74c3c'
                  - operator: template
                    value: |
                      [[[
                        return entity?.attributes?.status === 'offline';
                      ]]]
