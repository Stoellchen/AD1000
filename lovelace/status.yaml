views:
  - type: custom:grid-layout
    path: weather-alerts
    title: weather
    cards:
      - type: custom:auto-entities
        card:
          type: grid
          columns: 1
          square: false
        card_param: cards
        filter:
          include:
            - domain: sensor
              entity_id: sensor.*_weather_alert
              options:
                type: custom:meteoalarm-card
                integration: meteofrance
                entities:
                  - entity: this.entity_id
          exclude:
            - state: Vert
        else:
          type: heading
          heading: Keine Warnungen - alles im grünen
          heading_style: title
          icon: mdi:weather-cloudy-alert
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 50% 50%
          grid-template-areas: |
            "left right"
        cards:
          - type: weather-forecast
            show_current: true
            show_forecast: true
            entity: weather.bordeaux
            forecast_type: daily
            forecast_slots: 18
            grid_options:
              columns: 18
              rows: 2
          - type: weather-forecast
            show_current: true
            show_forecast: true
            entity: weather.marmande
            forecast_type: daily
            forecast_slots: 18
            grid_options:
              columns: 18
              rows: 2
          - type: horizontal-stack
            cards:
              - type: vertical-stack
                cards:
                  - type: weather-forecast
                    show_current: true
                    show_forecast: true
                    entity: weather.la_rochelle
                    forecast_type: daily
                    forecast_slots: 10
                    grid_options:
                      columns: 14
                      rows: 2
                  - type: custom:marees-france-card
                    device_id: 02b3a74e90c4cd675392a7bc84a2d002
                    show_header: true
                    title: null
                    card_type: full
              - type: vertical-stack
                cards:
                  - type: weather-forecast
                    show_current: true
                    show_forecast: true
                    entity: weather.royan
                    forecast_type: daily
                    forecast_slots: 10
                    grid_options:
                      columns: 14
                      rows: 2
                  - type: custom:marees-france-card
                    device_id: 98b61a38fabae6d88938afcd5138a801
                    show_header: true
                    title: null
                    card_type: full
          - type: horizontal-stack
            cards:
              - type: vertical-stack
                cards:
                  - type: weather-forecast
                    show_current: true
                    show_forecast: true
                    entity: weather.arcachon
                    forecast_type: daily
                    forecast_slots: 10
                    grid_options:
                      columns: 14
                      rows: 2
                  - type: custom:marees-france-card
                    device_id: bbb978af3b07fe90c10be0f672e4355e
                    show_header: true
                    title: null
                    card_type: full
              - type: vertical-stack
                cards:
                  - type: weather-forecast
                    show_current: true
                    show_forecast: true
                    entity: weather.mimizan
                    forecast_type: daily
                    forecast_slots: 10
                    grid_options:
                      columns: 14
                      rows: 2
                  - type: custom:marees-france-card
                    device_id: ecca56d38df7198a9a90d28f80f29387
                    show_header: true
                    title: null
                    card_type: full
    icon: mdi:weather-hail
