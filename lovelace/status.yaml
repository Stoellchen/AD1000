                    color: lightgreen
                    opacity: 1
                  - value: 600
                    color: green
                    opacity: 1
                  - value: 300
                    color: yellow
                    opacity: 1
                  - value: 200
                    color: orange
                    opacity: 1
                  - value: 100
                    color: red
                    opacity: 1
            apex_config:
              dataLabels:
                enabled: true
                dropShadow:
                  enabled: true
          - type: custom:apexcharts-card
