      - type: grid
        cards:
          - type: vertical-stack
            cards:
              - type: gauge
                entity: sensor.rafale_kraftstoffmenge
                max: 55
                unit: L
                name: Tank
                needle: true
                severity:
                  green: 25
                  yellow: 12
                  red: 0
          - type: custom:apexcharts-card
            graph_span: 35d
            experimental:
              color_threshold: true
            header:
              show: true
              title: Rafale
              show_states: false
              colorize_states: true
              floating: true
            now:
              show: true
              color: '#101010'
              label: jetzt grad
            series:
              - entity: sensor.rafale_kraftstoffmenge
                name: Rafale
                stroke_width: 5
                unit: L
                transform: return x;
                color_threshold:
                  - value: 40
                    color: lightgreen
                    opacity: 1
                  - value: 30
                    color: green
                    opacity: 1
                  - value: 14
                    color: orange
                    opacity: 1
                  - value: 7
                    color: red
                    opacity: 1
            apex_config:
              dataLabels:
                enabled: true
                dropShadow:
                  enabled: true
          - type: custom:apexcharts-card
            graph_span: 35d
            experimental:
              color_threshold: true
            header:
              show: true
