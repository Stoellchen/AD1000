                name: Rafale
                stroke_width: 5
                unit: Km
                transform: return x;
                color_threshold:
                  - value: 100000
                    color: red
                    opacity: 1
                  - value: 80000
                    color: orange
                    opacity: 1
                  - value: 60000
                    color: yellow
                    opacity: 1
                  - value: 21000
                    color: green
                    opacity: 1
                  - value: 20000
                    color: lightgreen
                    opacity: 1
            apex_config:
