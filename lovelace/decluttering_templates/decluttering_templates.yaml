global_header_badges_main:
  card:
    type: horizontal-stack
    cards:
      - type: markdown
        content: |
          ### [[title]]
          [[subtitle]]
        card_mod:
          style: |
            ha-card {
              box-shadow: none;
              background: none;
              padding: 4px 6px;
            }
      - type: horizontal-stack
        cards: [[badges]]

# --------------------------------------------------
global_header_main:
  card:
    type: custom:decluttering-card
    template: global_header_badges_main
    variables:
      - title: '[[title]]'
      - subtitle: '[[subtitle]]'
      - cards:
          - type: custom:analog-clock
            locale: de-CH
            diameter: 200
            hide_SecondHand: false
            color_HourHand: green
            color_MinuteHand: green
            color_SecondHand: red
            color_DigitalTime: green
            color_FaceDigits: lightgreen
            color_text: darkgreen
            style_hourhand: 2
            style_minutehand: 2
            style_secondhand: 4
            color_Ticks: green
            show_timezone: true
            color_background: "#040404"
            themes:
              - time: 23:00-08:00
                color_background: black
                style_secondhand: 3



# --------------------------------------------------
