views:
  - title: Home
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Alarmpanel
            heading_style: subtitle
            icon: mdi:keyboard
          - states:
              - arm_home
              - arm_away
              - arm_night
              - arm_vacation
              - arm_custom_bypass
            type: alarm-panel
            entity: alarm_control_panel.my_alarm
      - type: grid
        cards:
          - type: heading
            heading_style: subtitle
            heading: Geräte die abgeschaltet werden wenn man weg geht
            icon: mdi:walk
          - type: markdown
            content: >-
              ### 🏠 AWAY auto turn-off – runtime


              {% set data =
              state_attr('sensor.alarm_away_devices_definition','devices') %}

              {% if not data %}
                _No AWAY runtime data_
              {% else %}


              {% set ns = namespace(rooms={}) %}


              {# --- group by room --- #}

              {% for e, d in data.items() %}
                {% set room = d.room if d.room else 'No area' %}
                {% set ns.rooms = dict(
                  ns.rooms,
                  **{ room: (ns.rooms.get(room, []) + [e]) }
                ) %}
              {% endfor %}


              {% for room in ns.rooms.keys() | sort %}

              #### 📍 {{ room }}


              {% for entity in ns.rooms[room] | sort %}
                {% set d = data[entity] %}
                {% set s = states[entity] %}
                {% if s is not none %}

                {% set name = s.name if s.name else entity.split('.')[-1] %}
                {% set rem = d.remaining_sec | int(0) %}


                {% set s = states[entity].state if states[entity] is not none else 'unknown' %}
                {% if d.domain == 'light' %}
                  {% set icon =
                     'mdi:lightbulb' if s == 'on'
                     else 'mdi:lightbulb-off'
                  %}
                {% elif d.domain == 'switch' %}
                  {% set icon =
                     'mdi:power-plug' if s == 'on'
                     else 'mdi:power-plug-off-outline'
                  %}
                {% elif d.domain == 'fan' %}
                  {% set icon =
                     'mdi:fan' if s == 'on'
                     else 'mdi:fan-off'
                  %}    
                {% elif d.domain == 'media_player' %}
                  {% set icon =
                     'mdi:television-play' if s in ['playing','on']
                     else 'mdi:television-pause' if s == 'paused'
                     else 'mdi:television-off'
                  %}
                {% else %}
                  {% set icon = 'mdi:cog' %}
                {% endif %}


                {% if d.state == 'running' %}
                  {% set status_icon = 'mdi:chevron-triple-right' %}
                  {% set status_cls  = 'st-running' %}
                {% elif d.state == 'fire' %}
                  {% set status_icon = 'mdi:death-star' %}
                  {% set status_cls  = 'st-fire' %}
                {% elif d.state == 'executed' %}
                  {% set status_icon = 'mdi:chevron-triple-down' %}
                  {% set status_cls  = 'st-executed' %}
                {% elif d.state == 'idle' %}
                  {% set status_icon = 'mdi:circle-small' %}
                  {% set status_cls  = 'st-executed' %}
                {% else %}
                  {% set status_icon = 'mdi:coffin' %}
                  {% set status_cls  = 'st-idle' %}
                {% endif %}

                {% if rem > 0 %}
                  {% if rem >= 3600 %}
                    {% set time = '%02d:%02d:%02d' | format(rem // 3600, (rem % 3600) // 60, rem % 60) %}
                  {% else %}
                    {% set time = '%02d:%02d' | format(rem // 60, rem % 60) %}
                  {% endif %}
                {% else %}
                  {% set time = '00:00' %}
                {% endif %}

                {% set pct =
                (d.remaining_sec / d.default_sec * 100)
                if d.default_sec > 0 else 0 %}

                {% if pct >= 90 %}
                  {% set cls = 'lvl10' %}
                {% elif pct >= 80 %}
                  {% set cls = 'lvl9' %}
                {% elif pct >= 70 %}
                  {% set cls = 'lvl8' %}
                {% elif pct >= 60 %}
                  {% set cls = 'lvl7' %}
                {% elif pct >= 50 %}
                  {% set cls = 'lvl6' %}
                {% elif pct >= 40 %}
                  {% set cls = 'lvl5' %}
                {% elif pct >= 30 %}
                  {% set cls = 'lvl4' %}
                {% elif pct >= 20 %}
                  {% set cls = 'lvl3' %}
                {% elif pct >= 10 %}
                  {% set cls = 'lvl2' %}
                {% else %}
                  {% set cls = 'lvl1' %}
                {% endif %}

              - <ha-icon icon="{{ icon }}" class="{{ cls }}"></ha-icon> 
              <ha-icon  icon="{{ status_icon }}"  class="{{ status_cls
              }}"></ha-icon>    {{ name }}    <em>({{ time }})</em>

                {% endif %}
              {% endfor %}

              {% endfor %}

              {% endif %}
            card_mod:
              style: |
                ha-card ha-icon.lvl10 { color: light-green; }
                ha-card ha-icon.lvl9  { color: green; }
                ha-card ha-icon.lvl8  { color: yellow-green; }
                ha-card ha-icon.lvl7  { color: lime; }
                ha-card ha-icon.lvl6  { color: amber; }
                ha-card ha-icon.lvl5  { color: orange; }
                ha-card ha-icon.lvl4  { color: depp-orange; }
                ha-card ha-icon.lvl3  { color: light-red; }
                ha-card ha-icon.lvl2  { color: red; }
                ha-card ha-icon.lvl1  { color: dark-red ; }
                ha-card ha-icon.st-running {
                  color: #2ecc71;   /* green */
                }

                ha-card ha-icon.st-fire {
                  color: #ff9800;   /* orange */
                }

                ha-card ha-icon.st-executed {
                  color: #9e9e9e;   /* grey */
                }

                ha-card ha-icon.st-idle {
                  color: #cfd8dc;   /* very light */
                }

                ha-card {
                  padding: 6px 8px;
                }
                ha-markdown {
                  line-height: 1.15;
                }
                ha-markdown h3 {
                  margin: 0 0 6px 0;
                }
                ha-markdown h4 {
                  margin: 6px 0 2px 0;
                }
                ha-markdown ul {
                  margin: 0;
                  padding-left: 18px;
                }
                ha-markdown li {
                  margin: 0;
                  padding: 0;
                }
      - type: grid
        cards:
          - type: custom:analog-clock
            locale: de-CH
            diameter: 200
            hide_SecondHand: false
            color_HourHand: green
            color_MinuteHand: green
            color_SecondHand: red
            color_DigitalTime: green
            color_FaceDigits: lightgreen
            color_text: darkgreen
            style_hourhand: 2
            style_minutehand: 2
            style_secondhand: 4
            color_Ticks: green
            show_timezone: true
            color_background: '#040404'
            themes:
              - time: 23:00-08:00
                color_background: black
                style_secondhand: 3
          - type: tile
            grid_options:
              columns: full
            entity: switch.presense_simulation
            vertical: false
            features_position: bottom
          - type: tile
            entity: input_select.presense_simulation_profile
            vertical: false
            features_position: bottom
            grid_options:
              columns: full
          - type: tile
            entity: input_boolean.identity_alive_home_status
            features_position: bottom
            vertical: false
            grid_options:
              columns: full
      - type: grid
        cards:
          - type: markdown
            content: >
              ### 🏠 Presense Devices Target (CURRENT)

              {% set devices = expand('group.presense_simulationen_target') %}

              {% set rooms = devices
                 | map(attribute='entity_id')
                 | map('area_name')
                 | select('defined')
                 | unique
                 | sort
                 | list
              %}

              {% for room in rooms %} #### 📍 {{ room }} {% for e in devices |
              sort(attribute='name') %}
                {% if area_name(e.entity_id) == room %} 
                - {{ e.name }}
                {% endif %}
              {% endfor %}

              {% endfor %} {% set has_no_room = false %} {% for e in devices %}
                {% if area_name(e.entity_id) is none %}
                  {% set has_no_room = true %}
                {% endif %}
              {% endfor %}

              {% if has_no_room %} #### 📍 Ohne Raum {% for e in devices |
              sort(attribute='name') %}
                {% if area_name(e.entity_id) is none %}
              - {{ e.name }}
                {% endif %}
              {% endfor %} {% endif %}
